repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: debug-statements

  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["--max-line-length=88", "--extend-ignore=E203,W503,E402", "--exit-zero"]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: /home/liguozhou/install/miniconda3/envs/aiida/bin/pytest
        language: system
        pass_filenames: false
        always_run: true
        args: ["-x", "--tb=short", "-p", "no:cacheprovider", "aiida-uranium-workflow/tests/workflows/convergence/test_abacus.py"]
