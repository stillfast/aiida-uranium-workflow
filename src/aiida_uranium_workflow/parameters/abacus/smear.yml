lcao:
  abacus:
    parameters:
      input:
        nelec: 0.0
        nspin: 2
        basis_type: lcao
        ecutwfc: 100
        scf_thr: 1e-7
        smearing_method: gauss
        smearing_sigma: 0.015
        scf_nmax: 100
        calculation: scf
  kpoints_distance: 0.1 # the unit is A^-1
  pseudo_family: sg15_sz

