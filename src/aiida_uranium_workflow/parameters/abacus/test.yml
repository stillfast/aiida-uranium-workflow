        smearing_sigma: 0.015
        # scf_nmax is only a cap (ABACUS stops as soon as scf_thr is met):
        # the bcc-U vacancy needs 60 steps at 249 atoms and 120-187 steps
        # at 431 atoms, so 50 would abort them with "SCF not converged".
        scf_nmax: 250
        calculation: scf
        gamma_only: 1
        mixing_beta: 0.5
        mixing_ndim: 8
        symmetry: 0
        out_chg: -1
        ks_solver: genelpa
  kpoints_mesh: [1,1,1]
  pseudo_family: sg15_sz

# lcao_nums + 震荡提前退出（ABACUS scf_os_stop，v3.5.0+；v3.10.0 已实测接受）。
# 为什么不放在 supercell cell 里：WorkChain 的 _SCF_OVERRIDE_KEYS 白名单会
# 在 daemon 里过滤 per-cell 覆盖，而 daemon 是长驻进程、加载的是旧模块；
# scf preset 则在 CLI 进程里解析后整块传给 WorkChain，不受白名单影响。
#
# ★ 只给 ≥1024 原子的胞用。小/中胞（≤432 原子的空位生产算例）会误杀，见下。
#
# 标定依据：aiida-uranium-scripts/supercell/para_test/reports/scf_os_calibration.md
#   逐字复现 Charge_Mixing::if_scf_oscillate，在 416 个真实算例（216 个"确实
#   收敛" + 11 个 ≥1024 原子的真失败）上扫 (scf_os_ndim, scf_os_thr)。
#
#   关键结论：**≥1024 原子的已收敛算例，任何 (ndim, thr) 都误杀 0/45**，
#   所有误杀都出在小/中胞。所以大胞上唯一要选的是"多早触发"：
#     ndim=8  → 抓住 10/11 个大失败，中位 ELEC 9
#     ndim=12 → 9/11，ELEC 12
#     ndim=24 → 7/11，ELEC 24   ← 官方默认（=mixing_ndim），太晚
#
# 两个必须显式设置的坑：
# 1) `scf_os_ndim` 默认 = `mixing_ndim`（read_input_item_elec_stru.cpp:670）。
#    大胞用 mixing_ndim 24 ⇒ 最早 ELEC 24 才可能检查，而失败发生在 ELEC 4-5；
#    4394 原子那次 8 步就死的算例**永远抓不到**。必须与 mixing_ndim 解耦、取小。
# 2) `mixing_restart` 会把 `mixing_restart_last` 设为重启步号，而
#    if_scf_oscillate 里 `iteration < scf_os_ndim + mixing_restart_last` 直接 return
#    ⇒ 重启后又推迟 scf_os_ndim 步才开始检查（本例 ~4 步）。
#
# `scf_os_thr`：源码 `check_value` 强制**必须为负**（≥0 直接 WARNING_QUIT，
# "scf_os_thr should be negative"），所以只能在 (-∞, 0) 里取；取官方默认 -0.01
# 即可（在 ndim=8 上抓住率最好）。斜率 > -0.01 的含义是"每步降幅不足 2.3%"，
# 这对慢收敛/平坦段偏激进 —— 这正是小胞误杀（本文 8.3%）的来源，也是本 preset
# 不用于小胞的原因。
lcao_nums_os:
  abacus:
    parameters:
      input:
        nelec: 0.0
        basis_type: lcao
        nspin: 1
        ecutwfc: 65
        scf_thr: 1e-4
        smearing_method: mp
        smearing_sigma: 0.015
        scf_nmax: 250
        scf_os_stop: 1
        scf_os_ndim: 8
        scf_os_thr: -0.01
        calculation: scf
        gamma_only: 1
        mixing_beta: 0.5
        mixing_ndim: 8
        symmetry: 0
        out_chg: -1
        ks_solver: genelpa
  kpoints_mesh: [1,1,1]
  pseudo_family: sg15_sz

# NOTE: 本块原名 lcao_nums，与第 260 行的 lcao_nums 同名；PyYAML safe_load
