# ---------------------------------------------------------------------------
# Twisted graphene (carbin_test / abacus_twist_graphene) — the reference
# CPU input of that repository, ``abacus_twist_graphene/INPUT_cpu``:
#
#   calculation scf | symmetry 0 | ecutwfc 100 | scf_thr 1e-6 | scf_nmax 50
#   basis_type lcao | smearing gaussian sigma 0.02 | broyden beta 0.4
#   cal_force 1 | cal_stress 1 | ks_solver genelpa | device cpu | gamma_only 1
#
# Every value below is that file's, with three deliberate differences:
#
# * ``suffix`` is dropped — aiida-abacus overwrites it with ``aiida``
#   (OUT.aiida) in AbacusCalculation.write_input, so setting it here
#   would be silently ignored.
# * ``nspin: 1`` is made explicit (INPUT_cpu leaves it at the ABACUS
#   default, which is also 1). Graphene is non-magnetic: no spin.
# * ``nelec: 0.0`` is made explicit (0.0 = let ABACUS count the valence
#   electrons) — the house style of the other presets here.
#
# ``pseudo_family: sg15_sz`` carries ``C_ONCV_PBE-1.0.upf`` — byte-identical
# to the pseudopotential in the reference folder (md5 dd1f23aa…) — with the
# 7 au ``C_gga_7au_100Ry_2s2p1d.orb`` instead of the reference's 8 au
# orbital (same 2s2p1d configuration, smaller radial cutoff; no stored
# family holds that exact pair).
#
# NOTE: ``ecutwfc 100`` is the PW cutoff of the LCAO two-centre integrals;
# the ``100Ry`` inside the orbital filename is the cutoff used when the
# orbital was *generated*, not a runtime setting.
# ---------------------------------------------------------------------------

lcao_twist:
  abacus:
    parameters:
      input:
        nelec: 0.0
        basis_type: lcao
        nspin: 1
        ecutwfc: 100
        scf_thr: 1e-6
        scf_nmax: 50
        calculation: scf
        gamma_only: 1
        symmetry: 0
        smearing_method: gaussian
        smearing_sigma: 0.02
        mixing_type: broyden
        mixing_beta: 0.4
        cal_force: 1
        cal_stress: 1
        ks_solver: genelpa
        device: cpu
  kpoints_mesh: [1,1,1]
  pseudo_family: sg15_sz

lcao_alpha:
