# ---------------------------------------------------------------------------
# Example: seed the SCF from a stored converged charge density via
# ``abacus.extra_files`` (requires aiida-abacus with extra_files support).
#
#   * store the cube once:  SinglefileData(file="SPIN1_CHG.cube").store()
#     (pk=379124 / uuid=92adda66-ab2e-4d88-8ed9-535881a51d36 for the
#     2-atom bcc-U a=3.445 A cube in aiida-uranium-scripts/supercell/8_chg)
#   * ``extra_files``: {label: pk-or-uuid}; the file is copied into the
#     calc folder at ``<extra_files_basepath>/<node.filename>``, here
#     ./chg/SPIN1_CHG.cube — which ``read_file_dir`` then points at.
#   * run with workflow "base" and  parameters.abacus = {"test": "lcao_chg_file"}
# ---------------------------------------------------------------------------
lcao_chg_file:
  abacus:
    parameters:
      input:
        nelec: 0.0
        basis_type: lcao
        nspin: 1
        ecutwfc: 150
        scf_thr: 1e-8
        smearing_method: mp
        smearing_sigma: 0.0073529411764706
        scf_nmax: 100
        calculation: scf
        init_chg: file          # read the charge density instead of atomic
        read_file_dir: ./chg/   # where the cube lands (extra_files_basepath)
    extra_files:
      chg: 379124              # SinglefileData pk of SPIN1_CHG.cube
    extra_files_basepath: chg
  kpoints_mesh: [15, 15, 15]
  pseudo_family: sg15_sz

