tdos:
  abacus:
    run_bands: true
    run_dos: true
    run_proj_dos: false
    band_kpoints_distance: 0.02
    dos_kpoints_distance: 0.1
    band_mode: seekpath-aiida
    symprec: 1.0e-5
    additional_band_analysis_parameters: {}
  fleur:
    # FLEUR band / DOS overrides — Hartree energy window, primitive-cell
    # convention, per-atom band count. See parameters/fleur/banddos.yml
    # for the SCF base (jspins / l_noco / l_soc / smearing).
    band_wf:
      mode: band
      kpath: seek               # auto-generate high-symmetry path
      kpoints_distance: 0.02    # Å⁻¹
      # emin/emax = 0.40 / 1.14 Ha span ±10 eV around E_F ≈ 0.768 Ha
      # (nosoc SCF E_F; see the comment in the old banddos preset).
      emin: 0.40
      emax: 1.14
      use_primitive_cell: true
      inpxml_changes:
        - ['set_complex_tag', {tag_name: 'cutoffs', changes: {numbands: 20}}]
        - ['set_complex_tag', {tag_name: bzIntegration, changes: {mode: hist}}]
    dos_wf:
      mode: dos
      kpath: auto               # mesh, not a band path
      kpoints_distance: 0.1     # Å⁻¹
      emin: 0.40
      emax: 1.14
      use_primitive_cell: true
      inpxml_changes:
        - ['set_complex_tag', {tag_name: 'cutoffs', changes: {numbands: 20}}]
  vasp:
    # aiida-vasp (vasp.v2.bands): SCF -> seekpath k-path -> non-SCF band
    # pass -> constant-charge DOS pass. The SCF namespace (INCAR /
    # potential family / k-mesh) comes from parameters/vasp/scf.yml.
    run_bands: true
    run_dos: true
    run_proj_dos: false
    band_mode: seekpath-aiida
    band_kpoints_distance: 0.025   # 1/Angstrom spacing on the k-path
    dos_kpoints_distance: 0.03     # 1/Angstrom spacing of the DOS mesh
    # NEDOS: DOS 能量网格点数（VASP 默认 301 太粗，费米面附近几乎是空的）
    nedos: 3001
    symprec: 1.0e-5
    additional_band_analysis_parameters: {}

pdos:
  abacus:
    run_bands: false
    run_dos: true
    run_proj_dos: true
    band_kpoints_distance: 0.02
    dos_kpoints_distance: 0.1
    band_mode: seekpath-aiida
    symprec: 1.0e-5
    additional_band_analysis_parameters: {}
  vasp:
    # Projected DOS only (LORBIT=11 is added to the DOS pass by the
    # adapter). run_bands: false -> a single constant-charge DOS pass.
    run_bands: false
    run_dos: true
    run_proj_dos: true
    # 投影态密度：给 DOS 那一步加 LORBIT=11，逐原子 lm 分解写入 DOSCAR
    # （U 为 1+16 列），由 parsevasp 的 Doscar 读取（vasprun 的 <partial>
    # 对 f 电子解析不了，所以适配器同时把 DOSCAR 加入检索列表）。
    band_mode: seekpath-aiida
    band_kpoints_distance: 0.025
    dos_kpoints_distance: 0.02
    # NEDOS: DOS 能量网格点数（VASP 默认 301 太粗，费米面附近几乎是空的）
    nedos: 3001
    symprec: 1.0e-5
    additional_band_analysis_parameters: {}

# ---------------------------------------------------------------------------
# SOC runs (wider DOS k-mesh; FLEUR window centred on SOC E_F ≈ 1.444 Ha)
# ---------------------------------------------------------------------------

tdos_soc:
  abacus:
    run_bands: true
    run_dos: true
    run_proj_dos: false
    band_kpoints_distance: 0.02
    dos_kpoints_distance: 0.15
    band_mode: seekpath-aiida
    symprec: 1.0e-5
    additional_band_analysis_parameters: {}
  fleur:
    band_wf:
      mode: band
      kpath: seek
      kpoints_distance: 0.02
      # emin/emax = 1.08 / 1.81 Ha span ±10 eV around SOC E_F ≈ 1.444 Ha.
      emin: 1.08
      emax: 1.81
      use_primitive_cell: true
      inpxml_changes:
        - ['set_complex_tag', {tag_name: bzIntegration, changes: {mode: hist}}]
    dos_wf:
      mode: dos
      kpath: auto
      kpoints_distance: 0.15
      emin: 1.08
      emax: 1.81
      use_primitive_cell: true
      inpxml_changes:
        - ['set_complex_tag', {tag_name: 'cutoffs', changes: {numbands: 20}}]
        - ['set_complex_tag', {tag_name: bzIntegration, changes: {mode: hist}}]

pdos_soc:
  abacus:
    run_bands: false
    run_dos: true
    run_proj_dos: true
    band_kpoints_distance: 0.02
    dos_kpoints_distance: 0.15
    band_mode: seekpath-aiida
    symprec: 1.0e-5
    additional_band_analysis_parameters: {}

