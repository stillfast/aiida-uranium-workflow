# Defect workflow protocol — per-backend layout (same as magmom.yml).
# Each preset carries the defect-formation-energy settings:
#
#   supercell_matrix    — one supercell (diagonal [2,2,2] or a full 3x3
#                         matrix); omit to use the input structure as the
#                         host cell
#   supercell_cells     — LIST of per-cell specs, each with its own matrix
#                         AND its own k-mesh (k-point DENSITY should stay
#                         constant as the cell grows: halve the mesh when
#                         the cell doubles):
#                           - {matrix: [2,2,2], kpoints_mesh: [7,7,7]}
#                           - {matrix: [3,3,3], kpoints_mesh: [5,5,5]}
#                           - {matrix: [4,4,4], kpoints_mesh: [3,3,3]}
#                         each entry may also carry 'kpoints_distance'
#                         (1/Å) or a custom 'label'.
#                         **Per-cell SCF overrides** (ABACUS only): any of
#                         the keys in utils/defects.py::PER_CELL_SCF_KEYS
#                         may be given per entry and win over the shared
#                         ``parameters/abacus/scf.yml`` preset — most
#                         importantly ``mixing_ndim``, whose needed value
#                         grows with the cell size (measured on the bcc-U
#                         vacancy, fcc relaxes nothing else):
#                           249 atoms (5x5x5) → mixing_ndim 16  ✓ 60 steps
#                           431 atoms (6x6x6) → mixing_ndim 20  ✓ 187 steps
#                                              (24 → 120 steps, faster)
#                           1023 atoms (8x8x8) → NOT converged with any
#                             charge-mixing setting tried (ndim 8-32,
#                             gg0 1-5, fd/mp σ up to 0.05); the energy is
#                             converged (0.09 eV/1023 atoms) but the
#                             real-space drho criterion (1e-4) is not met
#                         NOTE: never set ``mixing_beta <= 0.1`` — ABACUS
#                         then silently skips its real-space Kerker
#                         preconditioner and the SCF gets *worse*.
#   supercell_matrices  — LIST of supercells for a size-convergence scan,
#                         e.g. [[2,2,2], [3,3,3], [4,4,4]]: one host + one
#                         defect calculation per matrix, each with its own
#                         formation energy in output_parameters['cells']
#                         (and a table in the report). A list under
#                         ``supercell_matrix`` is accepted too; note that
#                         three [n,n,n] rows are read as three cells, so a
#                         real 3x3 matrix belongs in a single-cell preset.
#   defect              — defect definition:
#                           vacancy:     {type: vacancy, site_index: int,
#                                         element: str, label: str}
#                           interstitial:{type: interstitial, element: str,
#                                         position: [x,y,z] (fractional),
#                                         label: str}
#                         ``site_index`` indexes the sites of the supercell;
#                         ``position`` is the fractional coordinate of the
#                         interstitial site (choose a sensible high-symmetry
#                         interstitial position, e.g. a tetrahedral /
#                         octahedral site — the code inserts the atom there).
#   wf_parameters       — {'mode': 'relax'|'scf'}: 'relax' optimizes atomic
#                         positions only (the cell stays fixed), 'scf' runs
#                         a plain fixed-lattice SCF.
#   formation energy     — E_f = E_defect − E_host × (N_defect / N_host)
#                         (no chemical potentials needed).
#   relax_settings      — force-convergence settings for the relax modes
#                         (both backends), matching the relax workflow
#                         protocol (parameters/relax.yml):
#                           abacus: force_cutoff 0.05 eV/Å (force_thr_ev)
#                                   (+ optional RelaxOptions overrides)
#                           fleur:  force_criterion 0.00097 Ha/bohr
#                                   (≈ 0.05 eV/Å; 1 Ha/bohr = 51.42 eV/Å)
#                                   + change_mixing_criterion / relax_iter
#                         Defaults (ABACUS): relax_type='positions' (atoms
#                         only, cell fixed), force_cutoff 0.05 eV/Å.
#
# The per-backend SCF base lives in ``parameters/<backend>/scf.yml``
# (shared with banddos / elastic / relax).
#
#   input.json:
#     {
#       "workflow": "defects",
#       "parameters": {
#         "abacus": {"scf": ["lcao_r"]},
#         "fleur":  {"scf": ["nosoc"]},
#         "defects": "test"
#       },
#       "static": {"structure": "bcc-uranium-0K", "metadata": "yunhe"},
#       "profile": "aiida_profile",
#       "code": {"abacus": "...", "fleur": "...", "inpgen": "..."}
#     }

test:
  abacus:
    supercell_matrix: [2, 2, 2]
    defect:
      type: vacancy
      site_index: 0
      element: U
      label: vac_U_0
    wf_parameters:
      mode: scf
  fleur:
    supercell_matrix: [2, 2, 2]
    defect:
      type: interstitial
      element: U
      # Fractional coordinate of the interstitial site inside the
      # supercell — adjust to the crystal's interstitial positions.
      position: [0.25, 0.25, 0.25]
      label: int_U
    wf_parameters:
      mode: relax

test_relax:
  abacus:
    supercell_matrix: [2, 2, 2]
    defect:
      type: vacancy
      site_index: 0
      element: U
      label: vac_U_0
    wf_parameters:
      mode: relax
    relax_settings:
      force_cutoff: 0.05       # eV/Å (force_thr_ev)
  fleur:
    supercell_matrix: [2, 2, 2]
    defect:
      type: interstitial
      element: U
      position: [0.25, 0.25, 0.25]
      label: int_U
    wf_parameters:
      mode: relax
    relax_settings:
      force_criterion: 0.00097      # Ha/bohr ≈ 0.05 eV/Å
      change_mixing_criterion: 0.005  # below the residual force (~0.008) so relax iterates to force_criterion instead of stopping with exit 354
      relax_iter: 5

vacancy_scf:
  abacus:
    supercell_matrices:
      - {matrix: [2, 2, 2], kpoints_mesh: [6, 6, 6]}
      - {matrix: [3, 3, 3], kpoints_mesh: [4, 4, 4]}
    defect:
      type: vacancy
      site_index: 0
      element: U
      label: vac_U_0
    wf_parameters:
      mode: scf
  fleur:
    supercell_matrix: [2, 2, 2]
    defect:
      type: vacancy
      site_index: 0
      element: U
      label: vac_U_0
    wf_parameters:
      mode: scf

vacancy_relax:
  abacus:
    supercell_matrices:
      - {matrix: [2, 2, 2], kpoints_mesh: [6, 6, 6]}
      - {matrix: [3, 3, 3], kpoints_mesh: [4, 4, 4]}
    defect:
      type: vacancy
      site_index: 0
      element: U
      label: vac_U_0
    wf_parameters:
      mode: relax
    relax_settings:
      force_cutoff: 0.05       # eV/Å (force_thr_ev)
  fleur:
    supercell_matrix: [2, 2, 2]
    defect:
      type: vacancy
      site_index: 0
      element: U
      label: vac_U_0
    wf_parameters:
      mode: relax
    relax_settings:
      force_criterion: 0.00097      # Ha/bohr ≈ 0.05 eV/Å
      change_mixing_criterion: 0.005  # below the residual force (~0.008) so relax iterates to force_criterion instead of stopping with exit 354
      relax_iter: 5

interstitial_scf:
  abacus:
    supercell_matrix: [2, 2, 2]
    defect:
      type: interstitial
      element: U
      position: [0.25, 0.25, 0.0]
      label: int_U
    wf_parameters:
      mode: scf
  fleur:
    supercell_matrix: [2, 2, 2]
    defect:
      type: interstitial
      element: U
      position: [0.25, 0.25, 0.0]
      label: int_U
    wf_parameters:
      mode: scf

interstitial_relax:
  abacus:
    supercell_matrix: [2, 2, 2]
    defect:
      type: interstitial
      element: U
      position: [0.25, 0.25, 0.0]
      label: int_U
    wf_parameters:
      mode: relax
    relax_settings:
      force_cutoff: 0.05       # eV/Å (force_thr_ev)
  fleur:
    supercell_matrix: [2, 2, 2]
    defect:
      type: interstitial
      element: U
      position: [0.25, 0.25, 0.0]
      label: int_U
    wf_parameters:
      mode: relax
    relax_settings:
      force_criterion: 0.00097      # Ha/bohr ≈ 0.05 eV/Å
      change_mixing_criterion: 0.005  # below the residual force (~0.008) so relax iterates to force_criterion instead of stopping with exit 354
      relax_iter: 5
# ---------------------------------------------------------------------------
# Supercell-size convergence scan: one WorkChain runs every cell in the list
# (one host + one defect calculation each) and reports E_f per cell.
# ---------------------------------------------------------------------------
vacancy_scan:
  abacus:
    supercell_matrices: [[2, 2, 2], [3, 3, 3], [4, 4, 4]]
    defect:
      type: vacancy
      site_index: 0
      element: U
      label: vac_U_0
    wf_parameters:
      mode: scf
  fleur:
    supercell_matrices: [[2, 2, 2], [3, 3, 3]]
    defect:
      type: vacancy
      site_index: 0
      element: U
      label: vac_U_0
    wf_parameters:
      mode: scf

vacancy_nums:
  abacus:
    supercell_matrices:
      - {matrix: [2, 2, 2], mixing_ndim: 8}
      - {matrix: [3, 3, 3], mixing_ndim: 8}
      - {matrix: [4, 4, 4], mixing_ndim: 12}
      - {matrix: [5, 5, 5], mixing_ndim: 16}
      - {matrix: [6, 6, 6], mixing_ndim: 24}
      - {matrix: [7, 7, 7], mixing_ndim: 24}
      - {matrix: [8, 8, 8], mixing_ndim: 24}
    defect:
      type: vacancy
      site_index: 0
      element: U
      label: vac_U_0
    wf_parameters:
      mode: scf
# ---------------------------------------------------------------------------
# Supercell scan with an individual k-mesh per cell (ABACUS only): the
# k-point DENSITY is kept roughly constant as the cell grows.
# ---------------------------------------------------------------------------
vacancy_scan_kmesh:
  abacus:
    supercell_cells:
      - {matrix: [2, 2, 2], kpoints_mesh: [7, 7, 7]}
      - {matrix: [3, 3, 3], kpoints_mesh: [5, 5, 5]}
      - {matrix: [4, 4, 4], kpoints_mesh: [3, 3, 3]}
    defect:
      type: vacancy
      site_index: 0
      element: U
      label: vac_U_0
    wf_parameters:
      mode: scf
