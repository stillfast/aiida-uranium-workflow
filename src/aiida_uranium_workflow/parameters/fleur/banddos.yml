U-NM-nosoc:
  # BCC-U 0K, **plain non-magnetic** SCF: jspins=1, l_noco=F, l_soc=F.
  # No mtNocoParams / coreElectrons.ctail overrides — those are only
  # needed for the noco backbone (jspins=2, l_noco=T).
  # The bzIntegration.mode is no longer restricted to 'hist' here.
  wf_parameters:
    mode: density
    density_converged: 1.0e-7
    itmax_per_run: 100
    fleur_runmax: 5
    add_comp_para:
      only_even_MPI: false
      max_queue_nodes: 20
      max_queue_wallclock_sec: 86400
    inpxml_changes:
      # aiida-fleur's ``FleurScfWorkChain`` requires each entry to be a
      # 2-tuple of ``(action_name, payload_dict)``. YAML mapping form
      # (``- set_inpchanges: {...}``) gets parsed as a one-key dict, not
      # a tuple, and the WorkChain aborts with ``should be tuple of 2``.
      # Use flow sequence form so each entry round-trips as a list
      # (JSON-serialisable, accepted by aiida-fleur's validator).
      #
      # Disable SOC and the noco backbone. ``l_noco=false`` makes
      # ``jspins`` the authoritative spin flag, so jspins=1 in
      # calc_parameters yields a single spin channel.
      - ['set_inpchanges', {changes: {l_noco: false, l_ss: false, l_soc: false}}]
      # bzIntegration is independent of noco — choose 'hist' or 'mp'
      # for the Brillouin-zone sampling.
      - ['set_complex_tag', {tag_name: bzIntegration, changes: {mode: hist, fermiSmearingEnergy: 0.0036743851}}]  # 0.1 eV / 27.2114 ≈ 0.003674 Htr
  calc_parameters:
    comp:
      kmax: 7.0
      gmaxxc: 12.0
      gmax: 16.0
      jspins: 1                  # non-magnetic: single spin channel
    kpt:
      div1: 11
      div2: 11
      div3: 11
      tkb: 0.0005
      gamma: true
    atom:
      element: U
      bmu: 0.0
  band_wf:
    mode: band
    kpath: seek               # auto-generate high-symmetry path
    kpoints_distance: 0.02    # Å⁻¹
    # NOTE: aiida-fleur 0.7.0's FleurBandDosWorkChain rejects ``proj``
    # and ``energy_range`` as "extra keys"; only total DOS / band is
    # produced. For atom-/orbital-resolved projections use a separate
    # proj-band workflow (see fleur.md §4.4 for the underlying FLEUR
    # feature) once aiida-fleur exposes one.
  dos_wf:
    mode: dos
    kpath: auto               # mesh, not a band path
    kpoints_distance: 0.1     # Å⁻¹

U-NM-soc:
  # BCC-U 0K, with spin-orbit coupling (l_soc=T, jspins=4, lspinorb,
  # noncolin). Same shape as nosoc; only l_soc + jspins differ.
  wf_parameters:
    mode: density
    density_converged: 1.0e-7
    itmax_per_run: 100
    fleur_runmax: 5
    add_comp_para:
      only_even_MPI: false
      max_queue_nodes: 20
      max_queue_wallclock_sec: 86400
    inpxml_changes:
      # Same caveat as U-NM-nosoc above — entries are 2-tuples so we
      # use YAML flow sequence form.
      - ['set_inpchanges', {changes: {l_noco: true, l_ss: false, l_soc: true}}]
      - ['set_inpchanges', {changes: {theta: 0.0, phi: 0.0, spav: false}, path_spec: {phi: {contains: soc}, theta: {contains: soc}}}]
      - ['set_complex_tag', {tag_name: mtNocoParams, changes: {l_mperp: 'T', l_relaxSQA: 'F'}}]
      - ['set_complex_tag', {tag_name: coreElectrons, changes: {ctail: 'F'}}]
      - ['set_complex_tag', {tag_name: bzIntegration, changes: {mode: hist, fermiSmearingEnergy: 0.0036743851}}]
  calc_parameters:
    comp:
      kmax: 7.0
      gmaxxc: 12.0
      gmax: 16.0
      jspins: 4              # lspinorb forces jspins=4
    kpt:
      div1: 11
      div2: 11
      div3: 11
      tkb: 0.0005
      gamma: true
    atom:
      element: U
      bmu: 0.0
  band_wf:
    mode: band
    kpath: seek
    kpoints_distance: 0.02
  dos_wf:
    mode: dos
    kpath: auto
    kpoints_distance: 0.1