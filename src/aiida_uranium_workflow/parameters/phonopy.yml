# Phonopy workflow protocol — phonopy-specific parameters only.
#
# The per-backend SCF base (physical / SCF input parameters, k-points,
# pseudopotentials) lives in ``parameters/<backend>/scf.yml`` — the same
# per-backend preset file shared with banddos / elastic / relax / eos.
# The workflow's ``input.json`` selects both sides::
#
#     {
#       "workflow": "phonopy",
#       "parameters": {
#         "abacus":  {"scf": ["test"]},   # ABACUS SCF preset (scf.yml)
#         "phonopy": "test"               # phonopy preset (this file)
#       },
#       "static": {"structure": "bcc-uranium-0K", "metadata": "yunhe"},
#       "profile": "aiida_profile",
#       "code": {"abacus": "abacus@yunhe", "phonopy": "phonopy@cloud"}
#     }
#
# Two families of implementations share this protocol:
#
# * **ABACUS / VASP / FLEUR** — frozen-phonon: displaced supercells are
#   computed with the SCF backend (forces) and post-processed with phonopy
#   (band structure + DOS). The keys below the preset (supercell_matrix /
#   primitive_matrix / band_mode / dos / ...) drive those backends. The
#   backend-specific force-run knobs live in a per-backend sub-block
#   (``vasp:`` for VASP — see the block at the end of ``standard``).
# * **QE** — no supercells and no phonopy code: the backend runs the
#   aiida-qe **DFPT** chain (pw.x SCF → ``quantumespresso.ph.base`` →
#   ``quantumespresso.q2r.base`` → ``quantumespresso.matdyn.base``) on
#   the seekpath primitive cell. The QE-specific knobs live in the
#   preset's ``qe`` sub-block (``qpoints_mesh`` / ph.x / q2r.x
#   convergence); the band-path / DOS rendering settings above are
#   shared. ``input.json`` needs three extra codes::
#
#       "code": {"qe": "pw@<host>", "ph": "ph@<host>",
#                "q2r": "q2r@<host>", "matdyn": "matdyn@<host>"}
#
# Each preset below is one phonon run. The structure must be the *relaxed*
# equilibrium cell — the finite-displacement method expands around it.
#
# NOTE for VASP: ``input.json`` needs both a VASP code (the displaced
# supercells) and a phonopy code (the post-processing), e.g.::
#
#     "code": {"vasp": "vaspstd@yeesuan", "phonopy": "phonopy@cloud"}

test:
  # ---- phonopy pre-processing (frozen-phonon supercells) -----------------
  # Supercell transformation of the **primitive** cell. With
  # ``primitive_matrix: auto`` the input structure is first reduced to its
  # minimal primitive cell and the supercell is built from that — so for
  # bcc-U (input = 2-atom conventional cell) a [2, 2, 2] supercell is only
  # 8 atoms (a [3, 3, 3] of the conventional cell would be 54). Either a
  # diagonal shorthand [n, n, n] or a full 3x3 matrix.
  supercell_matrix: [2, 2, 2]
  # Whether to work on the primitive cell of the input structure (phonopy's
  # ``primitive_matrix`` feature):
  #   auto          — the input cell is reduced to its primitive cell BEFORE
  #                   building the supercell; band structure / DOS are
  #                   computed on the primitive reciprocal space (required
  #                   for the named ``band_paths`` like "bcc" / "fcc" to
  #                   make sense).
  #   null / ~      — keep the input cell as-is (no primitive reduction).
  #   [[...]]       — explicit 3x3 primitive matrix.
  primitive_matrix: auto
  # Symmetry tolerance (Å) used for the displacement generation.
  symprec: 1.0e-5
  is_symmetry: true
  distinguish_kinds: true
  # Frozen-phonon displacement distance (Å).
  displacement_distance: 0.01

  # ---- phonopy post-processing -------------------------------------------
  # Band-path mode:
  #   auto   — high-symmetry path generated automatically (phonopy
  #            ``BAND_PATHS``): ``band_paths: auto`` uses seekpath; a named
  #            lattice path ("bcc", "fcc", "hcp", ...) can be given instead.
  #   manual — use the explicit ``band`` / ``band_labels`` lists below.
  band_mode: auto
  # auto mode: emitted as phonopy's BAND run-mode tag ("auto" via
  # seekpath, or a named path "bcc" / "fcc" / ...). NOTE: BAND_PATHS
  # alone only sets the path without running the band structure.
  band_paths: auto            # "auto" | "bcc" | "fcc" | ...
  # band: [0.0, 0.0, 0.0, 0.5, -0.5, 0.5, ...]   # manual mode: flat k-point list
  # band_labels: ["Γ", "H", "N", "Γ", "P", "H"]  # manual mode labels
  band_points: 51             # points per band segment

  # Total DOS (phonopy ``DOS`` + ``MESH``).
  dos: true
  mesh: [21, 21, 21]
  fmin: 0.0
  fmax: 8.0
  fpitch: 0.02

  # Scheduler options for the phonopy CalcJob (optional). Defaults:
  # 1 process, ``withmpi`` taken from the registered phonopy code.
  options: {}

  # ---- QE backend (DFPT, no supercells / phonopy) ------------------------
  # The QE phonon workflow runs pw.x SCF → ph.x → q2r.x → matdyn.x on the
  # seekpath primitive cell of the input structure. ``band_mode`` /
  # ``band_paths`` / ``dos`` / ``mesh`` above are shared: the band path
  # is always seekpath-auto and the DOS uses the shared ``mesh`` when
  # ``dos_mesh`` is not given below.
  qe:
    # Gamma-centred q-point mesh of the ph.x run (irreducible-q count is
    # reduced by symmetry — bcc-U 4×4×4 → 10 irreps).
    qpoints_mesh: [4, 4, 4]
    # ph.x convergence (INPUTPH): values validated on yeesuan
    # (test_qe_ph.py, QE 7.5) — tr2_ph 1e-12 + epsil=false converged in a
    # few minutes for the test cell; asr=true pins the acoustic branches
    # at Γ already at the ph.x level (q2r.x then reads ``zasr``, matdyn.x
    # reads ``asr``). Tighten tr2_ph if a metal needs it.
    ph:
      INPUTPH:
        tr2_ph: 1.0e-12
        epsil: false
        asr: true
    # q2r.x INPUT overrides (fildyn / flfrc are managed by the plugin);
    # the acoustic-sum rule keeps the Γ frequencies near zero. NOTE:
    # q2r.x reads ``zasr`` (``asr`` is the matdyn.x variable — q2r.x
    # aborts on unknown namelist keys).
    q2r:
      INPUT:
        zasr: crystal
    # matdyn.x INPUT overrides. The workflow forces ``asr='crystal'``
    # (acoustic-sum rule at interpolation time, so the acoustic branches
    # anchor at Γ = 0 — QE 7.5 matdyn reads ``asr``) and sets the ``dos``
    # flag per run; a preset value here wins over the default asr.
    matdyn: {}
    # Total DOS from a second matdyn.x run on a dense q mesh.
    dos: true
    dos_mesh: [21, 21, 21]

  # ---- VASP backend (frozen-phonon, static force runs) -------------------
  # Same pipeline as ABACUS / FLEUR: one force calculation per displaced
  # supercell, phonopy post-processing afterwards. The SCF base (INCAR,
  # POTCAR family, k-point density) comes from ``parameters/vasp/scf.yml``;
  # the block below only carries what the VASP force runs need on top.
  # ``input.json`` needs two codes: the VASP one and the phonopy one (the
  # post-processing CalcJob may live on another computer, e.g.
  # ``phonopy@cloud``):
  #
  #     "code": {"vasp": "vaspstd@yeesuan", "phonopy": "phonopy@cloud"}
  vasp:
    # INCAR tags of the displaced-supercell runs. Merged LAST into the
    # preset INCAR, so an SCF-preset value cannot turn the runs into
    # something that produces no forces. This is the VASP counterpart of
    # the ABACUS ``calculation=scf`` + ``cal_force=1`` pair:
    #   IBRION=-1  no ionic update (static)
    #   NSW=0      a single electronic loop
    #   ISIF=2     forces (and stress) are calculated — VASP's default for
    #              IBRION=-1, kept explicit on purpose
    # VASP writes <varray name="forces"> into vasprun.xml, which
    # aiida-vasp exposes as ``misc['forces']`` (eV/Å, one row per atom).
    incar:
      ibrion: -1
      nsw: 0
      isif: 2

test_fleur:
  # FLEUR backend: same phonopy settings as ``test``, forces computed by
  # FleurScfWorkChain in 'force' mode (l_f="T", see fleur.md §4.5 — FLEUR
  # only calculates atomic forces when the geometry optimisation is
  # active; aiida-fleur writes them to relax.xml, exposed as
  # relax_parameters['posforces'], Htr/bohr → eV/Å in the WorkChain).
  supercell_matrix: [2, 2, 2]
  primitive_matrix: auto
  symprec: 1.0e-5
  is_symmetry: true
  distinguish_kinds: true
  displacement_distance: 0.01

  band_mode: auto
  band_paths: auto
  band_points: 51

  dos: true
  mesh: [21, 21, 21]
  fmin: 0.0
  fmax: 8.0
  fpitch: 0.02

  options: {}
