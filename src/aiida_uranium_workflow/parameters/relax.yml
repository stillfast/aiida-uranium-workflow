# Relax workflow protocol — per-backend layout (same as magmom.yml /
# banddos.yml). Each preset carries ONLY the relaxation settings:
#
#   abacus:  relax_type=volume + force/stress cutoffs + meta-convergence
#   fleur:   full relaxation (positions + cell) — the plugin has no
#            volume-only mode
#   qe:      PwRelaxWorkChain-level controls (meta_convergence /
#            max_meta_convergence_iterations / clean_workdir) plus the
#            relax-mode keys ``relax_type`` ('positions' default — ions
#            move, cell fixed; 'volume' — vc-relax: for cubic /
#            orthorhombic lattices the hydrostatic stress keeps the cell
#            shape by symmetry so the converged cell is the volume-only
#            result (QE only accepts the strictly shape-locked
#            ``cell_dofree='volume'`` for ibrav=1 simple cubic);
#            'full' — vc-relax with all cell degrees of freedom) and
#            ``force_criterion`` (converged largest force in eV/Å → QE
#            CONTROL.forc_conv_thr). An explicit ``cell_dofree`` may be
#            given to lock specific cell degrees of freedom. The pw SCF
#            base comes from the shared ``parameters/qe/scf.yml`` presets
#            (``calculation`` is overridden by the protocol).
#
# The per-backend SCF base lives in the preset files under
# ``parameters/abacus/scf.yml`` and ``parameters/fleur/scf.yml``.
#
# NOTE on convergence criteria:
#   * The two backends intentionally keep different relax TYPES —
#     ABACUS relaxes only the cell VOLUME (full relax is hard to
#     converge for the SOC cases), FLEUR runs a FULL relaxation.
#   * The FORCE criteria are unified to the same physical value:
#     abacus.force_cutoff 0.03 eV/Å  ↔  fleur.force_criterion
#     0.0006 Ha/bohr (1 Ha/bohr = 51.42 eV/Å). FLEUR has no stress
#     criterion for atoms-only relaxation, so stress is ABACUS-only
#     (stress_cutoff in kBar).
#
#   input.json:
#     "parameters": {
#         "abacus": {"scf": ["test"]},   # SCF base only
#         "fleur":  {"scf": "U-NM-nosoc"},
#         "relax":  "test"               # this protocol preset (relax only)
#     }

test:
  abacus:
    # plugin abacus.relax → RelaxOptions: only the cell VOLUME is
    # relaxed (cell shape + atomic positions fixed).
    relax_type: volume
    relax_method: cg
    max_ionic_steps: 50
    force_cutoff: 0.05       # eV/Å (force_thr_ev)
    stress_cutoff: 1.0       # kBar (stress_thr)
    # Meta-convergence on the cell volume between relax iterations.
    meta_convergence: true
    volume_convergence: 0.01
    max_meta_convergence_iterations: 5
  fleur:
    # plugin fleur.relax: the plugin has no "volume-only" mode
    # (relaxation_type supports 'atoms' / None), so this runs a FULL
    # relaxation (atomic positions + cell).
    relaxation_type: atoms        # 'atoms' = full relax (positions + cell)
    # converged largest force, Ha/bohr (atomic units). Matches
    # abacus.force_cutoff 0.03 eV/Å: 1 Ha/bohr = 51.42 eV/Å,
    # so 0.0006 Ha/bohr ≈ 0.0309 eV/Å (was 0.001 ≈ 0.051 eV/Å).
    force_criterion: 0.00097   # converged largest force (atomic units)
    relax_iter: 5            # max relaxation steps
    run_final_scf: false     # run a final SCF on the relaxed structure?
    change_mixing_criterion: 0.025

  qe:
    # PwRelaxWorkChain controls — the pw SCF base comes from the shared
    # parameters/qe/scf.yml presets; meta-convergence re-runs the
    # relaxation until the structure stops changing. ``relax_type:
    # volume`` = vc-relax (bcc-U: shape kept by symmetry, converged
    # cell is the volume-only result); ``force_criterion`` 0.05 eV/Å.
    meta_convergence: true
    max_meta_convergence_iterations: 5
    relax_type: volume
    force_criterion: 0.05

test_soc:
  abacus:
    relax_type: volume
    relax_method: cg
    max_ionic_steps: 50
    force_cutoff: 0.05
    stress_cutoff: 1.0
    meta_convergence: true
    volume_convergence: 0.01
    max_meta_convergence_iterations: 5
  fleur:
    relaxation_type: atoms
    # converged largest force, Ha/bohr (atomic units). Matches
    # abacus.force_cutoff 0.03 eV/Å: 1 Ha/bohr = 51.42 eV/Å,
    # so 0.0006 Ha/bohr ≈ 0.0309 eV/Å (was 0.001 ≈ 0.051 eV/Å).
    force_criterion: 0.00097
    relax_iter: 5
    run_final_scf: false
    change_mixing_criterion: 0.025

  qe:
    # PwRelaxWorkChain controls — the pw relax parameters live in
    # parameters/qe/relax.yml (calculation=relax, ions bfgs,
    # force_conv_thr 1e-3 Ry/bohr). Meta-convergence re-runs the
    # relaxation until the structure stops changing.
    meta_convergence: true
    max_meta_convergence_iterations: 5


test_si:
  abacus:
    relax_type: volume
    relax_method: cg
    max_ionic_steps: 50
    force_cutoff: 0.03
    stress_cutoff: 1.0
    meta_convergence: true
    volume_convergence: 0.01
    max_meta_convergence_iterations: 5
  fleur:
    relaxation_type: atoms
    # converged largest force, Ha/bohr (atomic units). Matches
    # abacus.force_cutoff 0.03 eV/Å: 1 Ha/bohr = 51.42 eV/Å,
    # so 0.0006 Ha/bohr ≈ 0.0309 eV/Å (was 0.001 ≈ 0.051 eV/Å).
    force_criterion: 0.0006
    relax_iter: 10
    run_final_scf: false
    change_mixing_criterion: 0.025

  qe:
    # PwRelaxWorkChain controls — the pw relax parameters live in
    # parameters/qe/relax.yml (calculation=relax, ions bfgs,
    # force_conv_thr 1e-3 Ry/bohr). Meta-convergence re-runs the
    # relaxation until the structure stops changing.
    meta_convergence: true
    max_meta_convergence_iterations: 5
    # Only the cell volume is relaxed (vc-relax + cell_dofree=volume —
    # for bcc-U without free internal coordinates this is a pure
    # volume-only relax, the QE counterpart of abacus relax_type=volume).
    relax_type: volume
    # Converged largest force in eV/Å (→ QE IONS.force_conv_thr in
    # Ry/bohr). 0.03 eV/Å ≈ 1.17e-3 Ry/bohr, matching the abacus /
    # fleur force criteria.
    force_criterion: 0.03
