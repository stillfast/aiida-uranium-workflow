# Supercell SCF workflow protocol — per-backend layout.
#
# Runs one fixed-lattice SCF per supercell matrix, each with its own
# SCF parameters. The per-backend SCF base lives in
# ``parameters/<backend>/scf.yml``; this protocol supplies the
# supercell list and per-cell overrides on top of the base preset.
#
# Each supercell entry:
#   matrix     — 3×3 integer transformation matrix (rows = new lattice
#                vectors in terms of the primitive cell), e.g. the
#                identity for the primitive cell, diag(2,2,2) for the
#                2×2×2 supercell, or a non-diagonal integer matrix.
#   label      — optional short name (default "cell<N>").
#   SCF keys   — optional overrides applied on top of the base preset
#                (see workflows/supercell/abacus.py::_SCF_OVERRIDE_KEYS):
#                kpoints_mesh / kpoints_distance, scf_thr, scf_nmax,
#                mixing_beta, mixing_beta_mag, mixing_ndim, mixing_type,
#                mixing_restart, mixing_dmr, mixing_gg0, smearing_method,
#                smearing_sigma, symmetry, ...
#                NOTE: a key that is not in that tuple is silently
#                ignored (the cell then just re-runs the base preset) —
#                check `aiida-uranium check -i input.json` output plus
#                the child's INPUT before spending 4x 1024-atom runs.
#
# NOTE on restarts: the per-supercell AbacusBaseWorkChain is submitted
# with ``max_iterations = 0`` (see workflows/supercell/abacus.py) — a
# failed supercell SCF is *not* auto-restarted by the plugin.
#
# NOTE on k-points: per fleur.md, the k-point DENSITY should stay the
# same for the primitive cell and its supercells — halve the mesh as
# the cell doubles (e.g. 11³ primitive → 7³ for 2×2×2 → 5³ for 3×3×3).
#
# NOTE on performance (large supercells): ``rhog_symmetry`` (the density
# symmetrization step) is a known ABACUS bottleneck — on the 8×8×8
# (1024-atom) cell it consumed ~83 % of the wall time. With a 1×1×1
# k-mesh it carries no physics and can be disabled with ``symmetry: 0``
# (verified: 5.2× speedup on 4×4×4, ΔE = 0.03 meV/atom).
#
#   input.json:
#     "parameters": {
#         "abacus":  {"scf": ["lcao_r"]},   # SCF base (scf.yml)
#         "supercell": "test"               # this protocol preset
#     }

test:
  abacus:
    supercells:
      # Primitive cell, reference run.
      - matrix: [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
        label: 1x1x1
        kpoints_mesh: [11, 11, 11]
      # 2×2×2 supercell — halved k-mesh keeps the k density; a slightly
      # looser SCF threshold is often needed for large cells.
      - matrix: [[2, 0, 0], [0, 2, 0], [0, 0, 2]]
        label: 2x2x2
        kpoints_mesh: [7, 7, 7]
        scf_thr: 1e-6
        mixing_beta: 0.4
        mixing_ndim: 8
      # Non-diagonal example (kept commented — uncomment to use).
      # - matrix: [[2, 1, 0], [1, 2, 0], [0, 0, 2]]
      #   label: skew
      #   kpoints_distance: 0.1
      #   scf_thr: 1e-6

