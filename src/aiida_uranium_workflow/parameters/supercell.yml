# ============================================================================
# 11x11x11（2662 原子）收敛验证 —— 对照 num_test/AbacusCalculation-384005
#
# 384005 的实测：genelpa、scf_thr 1e-4、scf_nmax 250、**mixing_ndim 8**、
#   mp σ=0.015 Ry，2250 s/步；drho 在 GE4 从 3.6e-3 反弹到 2.1e-2，之后振荡并
#   发散（GE38 时 dE=+2e5 eV），38 步后撞 24 h wallclock，无结果。
# 本 preset 只改两处（其余与 lcao_nums 完全一致）：
#   mixing_ndim 8 -> 24  （实测规则：>=686 原子必须 >=16，推荐 24）
#   scf_nmax   250 -> 60 （避免再撞 wallclock；预计 11-20 步收敛）
# 提交：metadata `yeesuan_1n_384`（1 节点 / q_ysuan_384 / 380 GB / 48 h）求稳；
#       另投一份 `yeesuan_4n_384`（4 节点 / 224 ranks）测 genelpa 的多节点加速比。
# ============================================================================
conv_11x11x11:
  abacus:
    supercells:
      - matrix: [[11, 0, 0], [0, 11, 0], [0, 0, 11]]
        label: v11x11x11_ndim24
        scf_thr: 1e-4
        scf_nmax: 60
        mixing_ndim: 24
        mixing_beta: 0.5
        scf_os_stop: 1          # 震荡即提前退出：384005 会在 ELEC~6 停，省 ~20 h

# ============================================================================
# 11x11x11（2662 原子）—— 只换"机理"，不调参数（唯一一个算例）
#
# 依据：416 个历史算例的逐步 drho 统计，见
#   aiida-uranium-scripts/supercell/para_test/reports/scf_failure_anatomy.md
#   所有 >=1024 原子的算例都在 ELEC 4-5 出现 drho 反弹（中位 6 倍）；
#   1024 原子能恢复（42/43），>=2662 原子 0/5 恢复并数值爆炸（ELEC4 dE=+381 eV）。
#   反弹处正是 Broyden 历史第一次凑够 >=3 个向量、第一次真正外推的位置，
#   而这段历史全部来自线性暂态（前 3 步在 1024 与 2662 上几乎逐位相同）。
#
# mixing_restart 的源码语义（esolver_ks.cpp:379）：
#   drho <= mixing_restart 时，下一步清空混合历史、直接用输出密度当输入
#   = 暂态一结束就把垃圾历史扔掉，正是第 4 步那件事。
# 1e-2 比所有尺寸的反弹前 drho（1024: 9.1e-4 / 2000: 6.6e-4 / 2662: 3.6e-3）都大
#   => 在 ELEC 3->4 之间触发，是尺寸无关的常数。
#
# 历史教训：此前 4 个 mixing_restart 算例全部同时开了 mixing_dmr 1（DFT+U/EXX 的
# 另一个机制），结论混在一起无法判断 —— 本 preset 只开 mixing_restart。
#
# 判据：scf_thr 1e-4 下 drho 不反弹地降到 <1e-4、exit 0、能量 ~ -13532.7 eV/atom。
# ============================================================================
conv_11x11x11_restart:
  abacus:
    supercells:
      - matrix: [[11, 0, 0], [0, 11, 0], [0, 0, 11]]
        label: v11x11x11_restart1e-2
        scf_thr: 1e-4
        scf_nmax: 60
        mixing_ndim: 24
        mixing_beta: 0.5
        mixing_restart: 1e-2
        # 震荡保险的标定见 para_test/reports/scf_os_calibration.md：
        # scf_os_ndim 默认 = mixing_ndim = 24 ⇒ 最早 ELEC 24 才可能检查，
        # 再叠加 mixing_restart 推迟 (scf_os_ndim + mixing_restart_last)，实际要
        # ELEC≈28 才通电；而失败发生在 ELEC 4-5。故必须显式取小。
        # 实测：≥1024 原子的已收敛算例在任何 (ndim, thr) 下误杀都是 0/45；
        # ndim 8 能抓住 10/11 个大失败（中位 ELEC 9），ndim 24 只抓 7/11。
        # 阈值必须为负（源码强制），沿用官方默认 -0.01。
        scf_os_stop: 1
        scf_os_ndim: 8
        scf_os_thr: -0.01
