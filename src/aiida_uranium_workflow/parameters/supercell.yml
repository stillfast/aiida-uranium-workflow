# ---------------------------------------------------------------------------
# PEXSI scale scan: 1×1×1 → 4×4×4 with a Γ-only k-mesh and *identical*
# SCF settings everywhere, so the wall-time / energy difference across
# the cells shows the solver's size scaling. Pair it with
# parameters/abacus/scf.yml → ``lcao_1q_pexsi`` (ks_solver pexsi) and
# ``lcao_1q_fdref`` (the matched genelpa reference, same binary).
# atom counts: 2 / 16 / 54 / 128.
# ---------------------------------------------------------------------------

pexsi_scan:
  abacus:
    supercells:
      - matrix: [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
        label: 1x1x1_2at
        kpoints_mesh: [1, 1, 1]
      - matrix: [[2, 0, 0], [0, 2, 0], [0, 0, 2]]
        label: 2x2x2_16at
        kpoints_mesh: [1, 1, 1]
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: 3x3x3_54at
        kpoints_mesh: [1, 1, 1]
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_128at
        kpoints_mesh: [1, 1, 1]

# ---------------------------------------------------------------------------
# PEXSI scale scan, cells PEXSI can actually finish: 1×1×1 (2 atoms) and
# 2×2×2 (16 atoms), Γ-only, identical settings everywhere (see
# parameters/abacus/scf.yml → ``lcao_1q_pexsi`` / ``lcao_1q_fdref``). The
# 3×3×3 (54-atom) and 4×4×4 (128-atom) cells are deliberately absent:
# with this ABACUS build PEXSI's density is already inaccurate there —
# starting from a converged genelpa density the energy drifts by 10+ eV
# (harness: mag_diag/pexsi_step3/G2_54_genelpa_then_pexsi). ``pexsi_scan``
# keeps the full 1–4 ladder for when PEXSI is rebuilt/fixed.
# ---------------------------------------------------------------------------

pexsi_scan_small:
  abacus:
    supercells:
      - matrix: [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
        label: 1x1x1_2at
        kpoints_mesh: [1, 1, 1]
      - matrix: [[2, 0, 0], [0, 2, 0], [0, 0, 2]]
        label: 2x2x2_16at
        kpoints_mesh: [1, 1, 1]

# ===========================================================================
# PEXSI verification steps (one knob per step, para_test style).
# Every step keeps the SCF cell fixed (3×3×3 = 54 atoms unless noted) and
# varies ONE PEXSI parameter, so the steps can be read in order:
#   1_method -> 2_npole -> 3_delta_e -> 4_mu_bounds -> 5_temp -> 6_mixing
#   -> 7_nproc_pole -> 99_acceptance
# The base SCF preset is parameters/abacus/scf.yml -> lcao_1q_pexsi.
# ===========================================================================

# --- step 1: pexsi_method (1 contour integral / 2 Moussa / 3 AAA) ---------
# The FIRST version of this step ran the three methods with ABACUS's default
# mu bracket (∓10 Ry) and all three failed — but they failed for the *mu*
# reason, not for their own, so the comparison was confounded and had to be
# repeated.  The cells below therefore carry the mu fix (2.1-2.3 Ry, i.e.
# the Fermi level found from a converged genelpa run) plus a threshold PEXSI
# can actually reach, so that pexsi_method is the only variable.
# Method 3 has no tabulated pole set above numPole 40 -> lowered here
# (otherwise "getPole error." / SIGABRT, independent of everything else).
pexsi_method:
  abacus:
    supercells:
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_m1
        kpoints_mesh: [1, 1, 1]
        pexsi_method: 1
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_m2
        kpoints_mesh: [1, 1, 1]
        pexsi_method: 2
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_m3
        kpoints_mesh: [1, 1, 1]
        pexsi_method: 3

# --- step 2: pexsi_npole (hard table caps) -------------------------------
pexsi_npole:
  abacus:
    supercells:
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_np20
        kpoints_mesh: [1, 1, 1]
        pexsi_npole: 20
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_np30
        kpoints_mesh: [1, 1, 1]
        pexsi_npole: 30
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_np40
        kpoints_mesh: [1, 1, 1]
        pexsi_npole: 40
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_np60
        kpoints_mesh: [1, 1, 1]
        pexsi_npole: 60         # > 61 for method 2 -> getPole error

# --- step 3: pexsi_delta_e (spectral radius of S^-1 H, Ry) ---------------
# ABACUS default 20; the exact H(Gamma) spectrum of the 54-atom cell spans
# -21.46 .. +5.25 Ry (radius 26.7 Ry). NOTE: getPole returns the FIRST
# tabulated entry with numPole >= req && beta >= req, and for method 2 at
# numPole >= 60 only (60, beta=1.23e7) and (60, beta=4.44e7) exist, so all
# of these requests land on the SAME pole set - that is the point of the step.
pexsi_delta_e:
  abacus:
    supercells:
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_de15
        kpoints_mesh: [1, 1, 1]
        pexsi_delta_e: 15
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_de20
        kpoints_mesh: [1, 1, 1]
        pexsi_delta_e: 20
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_de25
        kpoints_mesh: [1, 1, 1]
        pexsi_delta_e: 25

# --- step 4: pexsi_mu_lower/upper  ★ the decisive knob -------------------
# The mu search can only resolve mu to (upper - lower)/81 Ry; ABACUS's
# default is ∓10 Ry -> 0.247 Ry = 3.4 eV. For the 54-atom cell mu = 2.2046 Ry
# (from a converged genelpa run: occupations cross 2 -> 0 there).
pexsi_mu_bounds:
  abacus:
    supercells:
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_mu_wide      # ABACUS default
        kpoints_mesh: [1, 1, 1]
        pexsi_mu_lower: -10
        pexsi_mu_upper: 10
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_mu_020
        kpoints_mesh: [1, 1, 1]
        pexsi_mu_lower: 2.1
        pexsi_mu_upper: 2.3
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_mu_010
        kpoints_mesh: [1, 1, 1]
        pexsi_mu_lower: 2.15
        pexsi_mu_upper: 2.25

# --- step 5: pexsi_temp / smearing_sigma (Ry; must stay equal) -----------
pexsi_temp:
  abacus:
    supercells:
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_T0p1eV
        kpoints_mesh: [1, 1, 1]
        smearing_sigma: 0.0075
        pexsi_temp: 0.0075
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_T0p2eV
        kpoints_mesh: [1, 1, 1]
        smearing_sigma: 0.015
        pexsi_temp: 0.015
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_T0p3eV
        kpoints_mesh: [1, 1, 1]
        smearing_sigma: 0.0225
        pexsi_temp: 0.0225
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_T0p5eV
        kpoints_mesh: [1, 1, 1]
        smearing_sigma: 0.0375
        pexsi_temp: 0.0375
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_T0p8eV
        kpoints_mesh: [1, 1, 1]
        smearing_sigma: 0.06
        pexsi_temp: 0.06

# --- step 6: mixing_beta (PEXSI limit-cycles at 0.5, genelpa does not) ---
pexsi_mixing:
  abacus:
    supercells:
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_beta0p2
        kpoints_mesh: [1, 1, 1]
        mixing_beta: 0.2
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_beta0p5
        kpoints_mesh: [1, 1, 1]
        mixing_beta: 0.5
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_beta0p8
        kpoints_mesh: [1, 1, 1]
        mixing_beta: 0.8

# --- step 7: pexsi_nproc_pole (processes per pole; must divide 56) -------
pexsi_nproc_pole:
  abacus:
    supercells:
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_pole1
        kpoints_mesh: [1, 1, 1]
        pexsi_nproc_pole: 1
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_pole2
        kpoints_mesh: [1, 1, 1]
        pexsi_nproc_pole: 2
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_pole4
        kpoints_mesh: [1, 1, 1]
        pexsi_nproc_pole: 4

pexsi_symm:
  abacus:
    supercells:
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_symm_1
        kpoints_mesh: [1, 1, 1]
        pexsi_symm: true
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_symm_0
        kpoints_mesh: [1, 1, 1]
        pexsi_symm: false

# --- 99_acceptance: final PEXSI (mu-fixed) vs genelpa on the same 54-atom cell
pexsi_acceptance:
  abacus:
    supercells:
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: 3x3x3_accept
        kpoints_mesh: [1, 1, 1]
        scf_thr: 1e-5
        scf_nmax: 60

# --- 10_energy: locate the ~831 eV PEXSI-vs-genelpa energy offset ---------
# The method comparison (step 1, mu fixed) showed all three pole expansions
# agree to 0.02 eV/atom yet all sit ~831 eV above the genelpa reference, so
# the offset is method-independent.  This step keeps the cell, k-mesh, mu
# bracket and SCF thresholds fixed and varies only the *density accuracy*
# knobs, while the energy decomposition (E_band / E_one_elec / E_Hartree /
# E_xc / E_Ewald / E_entropy / E_Fermi) is compared term by term against the
# genelpa reference (99_acceptance/input_genelpa.json, same cell/settings).
pexsi_energy:
  abacus:
    supercells:
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: 3x3x3_etr1e4        # baseline (preset value)
        kpoints_mesh: [1, 1, 1]
        pexsi_mu_lower: 2.1
        pexsi_mu_upper: 2.3
        scf_thr: 1e-5
        scf_nmax: 60
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: 3x3x3_etr1e5        # tighter density-matrix tolerance
        kpoints_mesh: [1, 1, 1]
        pexsi_mu_lower: 2.1
        pexsi_mu_upper: 2.3
        pexsi_elec_thr: 1e-5
        scf_thr: 1e-5
        scf_nmax: 60
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: 3x3x3_mutr1e5       # tighter chemical-potential tolerance
        kpoints_mesh: [1, 1, 1]
        pexsi_mu_lower: 2.1
        pexsi_mu_upper: 2.3
        pexsi_mu_thr: 1e-5
        scf_thr: 1e-5
        scf_nmax: 60

# --- 4_mu_bounds (width scan): the mu bracket IS the knob ----------------
# PEXSI's mu search resolves mu only to (upper - lower)/81 Ry, so the width
# of the bracket -- not its accuracy knobs -- sets the charge error.
# True mu of this cell: 2.2046 Ry (LAPACK on the same H/S; ABACUS's own
# genelpa run prints E_Fermi = 29.9953 eV = 2.2046 Ry).  The last cell is a
# tight-but-misplaced bracket: it shows that resolution alone is not enough.
pexsi_mu_scan:
  abacus:
    supercells:
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: 3x3x3_mu_w10      # ABACUS default, grid 247 mRy
        kpoints_mesh: [1, 1, 1]
        pexsi_mu_lower: -10
        pexsi_mu_upper: 10
        scf_thr: 1e-5
        scf_nmax: 60
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: 3x3x3_mu_w05      # ±0.5 Ry, grid 12.3 mRy
        kpoints_mesh: [1, 1, 1]
        pexsi_mu_lower: 1.7
        pexsi_mu_upper: 2.7
        scf_thr: 1e-5
        scf_nmax: 60
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: 3x3x3_mu_w025     # ±0.25 Ry, grid 6.2 mRy
        kpoints_mesh: [1, 1, 1]
        pexsi_mu_lower: 1.95
        pexsi_mu_upper: 2.45
        scf_thr: 1e-5
        scf_nmax: 60
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: 3x3x3_mu_w01      # ±0.10 Ry, grid 2.5 mRy
        kpoints_mesh: [1, 1, 1]
        pexsi_mu_lower: 2.1
        pexsi_mu_upper: 2.3
        scf_thr: 1e-5
        scf_nmax: 60
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: 3x3x3_mu_w005     # ±0.05 Ry, grid 1.2 mRy
        kpoints_mesh: [1, 1, 1]
        pexsi_mu_lower: 2.15
        pexsi_mu_upper: 2.25
        scf_thr: 1e-5
        scf_nmax: 60
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: 3x3x3_mu_wrong    # narrow but around the wrong place
        kpoints_mesh: [1, 1, 1]
        pexsi_mu_lower: 2.5
        pexsi_mu_upper: 2.7
        scf_thr: 1e-5
        scf_nmax: 60

# --- 4_mu_bounds (centre scan): centre the bracket on the true mu --------
# The width scan showed the SCF energy is not monotone in the bracket width:
# [1.95,2.45] landed 2.8 eV from genelpa while [2.1,2.3] was 831 eV off,
# although both are centred on 2.2.  The matrix-level test then showed why
# the *centre* is what matters: a bracket centred exactly on the true
# mu (2.2046 Ry) is returned as-is (mu error 5e-6 Ry, charge error 0.016
# electrons, DM error 3.5e-5), whereas a bracket centred at 2.2 keeps that
# 4.6 mRy offset.  These cells centre the bracket on 2.2046 with three
# widths, plus a repeat of the width-scan winner as a reproducibility check.
pexsi_mu_centre:
  abacus:
    supercells:
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: 3x3x3_c_005        # ±0.05 centred on the truth
        kpoints_mesh: [1, 1, 1]
        pexsi_mu_lower: 2.1546
        pexsi_mu_upper: 2.2546
        scf_thr: 1e-5
        scf_nmax: 60
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: 3x3x3_c_01         # ±0.10 centred on the truth
        kpoints_mesh: [1, 1, 1]
        pexsi_mu_lower: 2.1046
        pexsi_mu_upper: 2.3046
        scf_thr: 1e-5
        scf_nmax: 60
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: 3x3x3_c_025        # ±0.25 centred on the truth
        kpoints_mesh: [1, 1, 1]
        pexsi_mu_lower: 1.9546
        pexsi_mu_upper: 2.4546
        scf_thr: 1e-5
        scf_nmax: 60
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: 3x3x3_c_repeat     # width-scan winner, reproducibility
        kpoints_mesh: [1, 1, 1]
        pexsi_mu_lower: 1.95
        pexsi_mu_upper: 2.45
        scf_thr: 1e-5
        scf_nmax: 60

# --- 11_density: is the 0.38 eV case the *same solution* as genelpa? -------
# Same 54-atom cell, same basis/k-mesh/smearing/thresholds, out_chg "1 10";
# one cell per solver, so the converged charge densities can be diffed point
# by point (Out.<suffix>/chg.cube).  The PEXSI cell carries the best mu
# bracket found in 4_mu_bounds (centre on the true mu, width 0.5 Ry) — the
# cell whose total energy is 0.38 eV from genelpa.
pexsi_density:
  abacus:
    supercells:
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: 3x3x3_dens_genelpa
        kpoints_mesh: [1, 1, 1]
        ks_solver: genelpa
        mixing_beta: 0.5
        scf_thr: 1e-5
        scf_nmax: 100
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: 3x3x3_dens_pexsi
        kpoints_mesh: [1, 1, 1]
        pexsi_mu_lower: 1.9546
        pexsi_mu_upper: 2.4546
        scf_thr: 1e-5
        scf_nmax: 100

# ============================================================================
# PEXSI 参数优化（54 原子 bcc U，Gamma-only，scf_thr 1e-6）
# 用法：scf preset 用 `lcao_1q_pexsi`（scf_thr 1e-6 / scf_nmax 100 / symmetry 0 /
# pexsi_method 2 / npole 60 / nproc_pole 2 / elec_thr 1e-4 / mu_thr 1e-3 / delta_e 20），
# 每个 cell 相对 base 只改一个参数（与 abacus.md 10.2.x 的写法一致）。
# base = ks_solver pexsi, mixing_beta 0.5, pexsi_nproc_pole 8, pexsi_npole 60,
#        pexsi_nmax 10（库内自洽求 mu 的迭代上限）
# 注意：mu 现在由 PEXSI 自己解（库补丁），这些 cell 都不给 pexsi_mu_lower/upper。
# ============================================================================
pexsi_opt1:
  abacus:
    supercells:
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: opt1_genelpa_050      # 参照：genelpa + mixing 0.5（不在 PEXSI 扫描链上）
        kpoints_mesh: [1, 1, 1]
        ks_solver: genelpa
        mixing_beta: 0.5
        scf_thr: 1e-6
        scf_nmax: 100
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: opt1_base             # PEXSI 基线
        kpoints_mesh: [1, 1, 1]
        mixing_beta: 0.5
        pexsi_nproc_pole: 8
        pexsi_nmax: 10
        scf_thr: 1e-6
        scf_nmax: 100
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: opt1_mix02            # 单变量：mixing_beta 0.2
        kpoints_mesh: [1, 1, 1]
        mixing_beta: 0.2
        pexsi_nproc_pole: 8
        pexsi_nmax: 10
        scf_thr: 1e-6
        scf_nmax: 100
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: opt1_nproc2           # 单变量：nproc_pole 2
        kpoints_mesh: [1, 1, 1]
        mixing_beta: 0.5
        pexsi_nproc_pole: 2
        pexsi_nmax: 10
        scf_thr: 1e-6
        scf_nmax: 100
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: opt1_nproc28          # 单变量：nproc_pole 28
        kpoints_mesh: [1, 1, 1]
        mixing_beta: 0.5
        pexsi_nproc_pole: 28
        pexsi_nmax: 10
        scf_thr: 1e-6
        scf_nmax: 100
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: opt1_npole40          # 单变量：npole 40
        kpoints_mesh: [1, 1, 1]
        mixing_beta: 0.5
        pexsi_nproc_pole: 8
        pexsi_npole: 40
        pexsi_nmax: 10
        scf_thr: 1e-6
        scf_nmax: 100
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: opt1_npole30          # 单变量：npole 30（看精度边界）
        kpoints_mesh: [1, 1, 1]
        mixing_beta: 0.5
        pexsi_nproc_pole: 8
        pexsi_npole: 30
        pexsi_nmax: 10
        scf_thr: 1e-6
        scf_nmax: 100
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: opt1_nmax2            # 单变量：mu 迭代上限 2
        kpoints_mesh: [1, 1, 1]
        mixing_beta: 0.5
        pexsi_nproc_pole: 8
        pexsi_nmax: 2
        scf_thr: 1e-6
        scf_nmax: 100

# ============================================================================
# 批 2a：pexsi_npole 标定（54 原子，scf_thr 1e-6）
# 背景：批 1 发现 npole=40 与 genelpa 差 0.009 meV/atom，而 npole=60 差 7.07 meV/atom
# —— 因为 getPole 的硬编码极点表是按 (method, numPole, beta=deltaE/T) 查表的，
# 请求不同的 npole 会落到**不同的极点表项**，不是"越多越准"。
# 本批扫描 method 2 表的合法档位 4..61 中的代表值，找出与 genelpa 一致且最快的取值。
# 参照：opt1_genelpa_050（genelpa + mixing 0.5，−13532.568233 eV/atom）
# ============================================================================
pexsi_opt2a:
  abacus:
    supercells:
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: opt2a_npole20
        kpoints_mesh: [1, 1, 1]
        ks_solver: pexsi
        mixing_beta: 0.5
        pexsi_method: 2
        pexsi_npole: 20
        pexsi_nproc_pole: 8
        pexsi_nmax: 10
        pexsi_delta_e: 20
        pexsi_elec_thr: 1e-4
        pexsi_mu_thr: 1e-3
        scf_thr: 1e-6
        scf_nmax: 100
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: opt2a_npole24
        kpoints_mesh: [1, 1, 1]
        ks_solver: pexsi
        mixing_beta: 0.5
        pexsi_method: 2
        pexsi_npole: 24
        pexsi_nproc_pole: 8
        pexsi_nmax: 10
        pexsi_delta_e: 20
        pexsi_elec_thr: 1e-4
        pexsi_mu_thr: 1e-3
        scf_thr: 1e-6
        scf_nmax: 100
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: opt2a_npole28
        kpoints_mesh: [1, 1, 1]
        ks_solver: pexsi
        mixing_beta: 0.5
        pexsi_method: 2
        pexsi_npole: 28
        pexsi_nproc_pole: 8
        pexsi_nmax: 10
        pexsi_delta_e: 20
        pexsi_elec_thr: 1e-4
        pexsi_mu_thr: 1e-3
        scf_thr: 1e-6
        scf_nmax: 100
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: opt2a_npole32
        kpoints_mesh: [1, 1, 1]
        ks_solver: pexsi
        mixing_beta: 0.5
        pexsi_method: 2
        pexsi_npole: 32
        pexsi_nproc_pole: 8
        pexsi_nmax: 10
        pexsi_delta_e: 20
        pexsi_elec_thr: 1e-4
        pexsi_mu_thr: 1e-3
        scf_thr: 1e-6
        scf_nmax: 100
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: opt2a_npole36
        kpoints_mesh: [1, 1, 1]
        ks_solver: pexsi
        mixing_beta: 0.5
        pexsi_method: 2
        pexsi_npole: 36
        pexsi_nproc_pole: 8
        pexsi_nmax: 10
        pexsi_delta_e: 20
        pexsi_elec_thr: 1e-4
        pexsi_mu_thr: 1e-3
        scf_thr: 1e-6
        scf_nmax: 100
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: opt2a_npole40
        kpoints_mesh: [1, 1, 1]
        ks_solver: pexsi
        mixing_beta: 0.5
        pexsi_method: 2
        pexsi_npole: 40
        pexsi_nproc_pole: 8
        pexsi_nmax: 10
