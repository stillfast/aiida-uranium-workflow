# 批 2c：pexsi_nmax 阈值 + SelInv 性能开关（54 原子，基线同批 2b）
#
# 批 2b 结论：nmax 2 / 5 → exit 302（100 步不收敛，末步 EDIFF 84 / 6.3），
# nmax 10 正常 ⇒ 本批二分 6/8/12/20 找最小可用值。注意修复后驱动内部的
# μ 自洽求解上限是 min(maxPEXSIIter, 10)，所以 >10 的 nmax 预期与 10 等价
# （若确实等价，说明 nmax ≥ 10 即可，不必加大）。
#
# SelInv 性能开关（只影响时间/内存，不该影响能量）：
#   pexsi_ordering     0 PARMETIS(默认) / 1 METIS_AT_PLUS_A / 2 MMD_AT_PLUS_A / 3 NATURAL
