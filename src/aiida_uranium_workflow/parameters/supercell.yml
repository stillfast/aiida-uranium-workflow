# ============================================================================
# 冒烟测试：`pexsi_symm` 的布尔值能不能一路走到 ABACUS
# 目的：验证 supercell preset 里的 `pexsi_symm: true / false`（YAML 布尔）
#   ① 是否在 `_SCF_OVERRIDE_KEYS` 白名单内（代码：workflows/supercell/abacus.py:111 ✓）
#   ② aiida-abacus 用 f"{key:<30}{value}" 写 INPUT，Python str(True) = "True"
#   ③ ABACUS 的 assume_as_boolean() 会先 FmtCore::lower()，接受
#      true/1/t/yes/y/on 与 false/0/f/no/n/off  ⇒ "True"/"False" 合法
# 16 原子 + 1 步就能验证机制（比 128 原子便宜 8 倍）。
# ============================================================================
pexsi_symm_smoke:
  abacus:
    supercells:
      - matrix: [[2, 0, 0], [0, 2, 0], [0, 0, 2]]
        label: 2x2x2_symm_true
        kpoints_mesh: [1, 1, 1]
        pexsi_symm: true
        scf_nmax: 3
      - matrix: [[2, 0, 0], [0, 2, 0], [0, 0, 2]]
        label: 2x2x2_symm_false
        kpoints_mesh: [1, 1, 1]
        pexsi_symm: false
        scf_nmax: 3

# 15_dm_purification：只跑一个 3x3x3（54 原子）来导出 H、S、DM 参考
purif_dump_333:
  abacus:
    supercells:
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: 3x3x3_dump
        kpoints_mesh: [1, 1, 1]

# ============================================================================
# 99_scf_thr/para_test：1024 原子 SCF 收敛性参数测试
# 背景：`test_scf_thr` 里 scf_thr 1e-5 与 1e-6 的轨迹逐位相同且都在 50 步内发散
#   （drho 触底 ~1e-4 后反弹 → 第 50 步 drho 2e-2、dE +55 eV）⇒ 不是阈值问题，
#   是混合失稳 + LCAO 密度噪声底。本批固定 scf_thr 1e-5，逐个改混合/展宽/能带数，
#   看谁能真正把 drho 压到 <1e-5。
# 共同：8x8x8 (1024 原子)、Γ-only、sg15_sz、ecutwfc 65、genelpa、scf_nmax 80
#   （原 50 太短）、smearing mp。scf preset = `lcao_1q`。
# 提交：metadata `yeesuan_190g`（q_ysuan，1 节点 185 GB，12 h），code `abacus_lts@yeesuan`。
# 判据：drho 单调降到 <1e-5 并保持 = 成功；全部压不下去 = LCAO 噪声底，1e-4 即实际下限。
# ============================================================================
test_scf_conv:
  abacus:
    supercells:
      - matrix: [[8, 0, 0], [0, 8, 0], [0, 0, 8]]
        label: p_baseline
        scf_thr: 1e-5
        scf_nmax: 80
        mixing_beta: 0.5
        mixing_ndim: 8
      - matrix: [[8, 0, 0], [0, 8, 0], [0, 0, 8]]
        label: p_gg0_2
        scf_thr: 1e-5
        scf_nmax: 80
        mixing_beta: 0.5
        mixing_ndim: 8
        mixing_gg0: 2
      - matrix: [[8, 0, 0], [0, 8, 0], [0, 0, 8]]
        label: p_gg0_5
        scf_thr: 1e-5
        scf_nmax: 80
        mixing_beta: 0.5
        mixing_ndim: 8
        mixing_gg0: 5
      - matrix: [[8, 0, 0], [0, 8, 0], [0, 0, 8]]
        label: p_ndim24
        scf_thr: 1e-5
        scf_nmax: 80
        mixing_beta: 0.5
        mixing_ndim: 24
      - matrix: [[8, 0, 0], [0, 8, 0], [0, 0, 8]]
        label: p_restart001
        scf_thr: 1e-5
        scf_nmax: 80
        mixing_beta: 0.5
        mixing_ndim: 8
        mixing_restart: 0.01
      - matrix: [[8, 0, 0], [0, 8, 0], [0, 0, 8]]
        label: p_beta02
        scf_thr: 1e-5
        scf_nmax: 80
        mixing_beta: 0.2
        mixing_ndim: 8
      - matrix: [[8, 0, 0], [0, 8, 0], [0, 0, 8]]
        label: p_sigma03
        scf_thr: 1e-5
        scf_nmax: 80
        mixing_beta: 0.5
        mixing_ndim: 8
        smearing_sigma: 0.0220588235294118
      - matrix: [[8, 0, 0], [0, 8, 0], [0, 0, 8]]
        label: p_nbands12
        scf_thr: 1e-5
        scf_nmax: 80
        mixing_beta: 0.5
        mixing_ndim: 8
        nbands: 19661
      - matrix: [[8, 0, 0], [0, 8, 0], [0, 0, 8]]
        label: p_combo
        scf_thr: 1e-5
        scf_nmax: 80
        mixing_beta: 0.2
        mixing_ndim: 24
        mixing_gg0: 5
        mixing_restart: 0.01

# ============================================================================
# 99_scf_thr/para_test 第二批：mixing_ndim 的边界 + scf_thr 能到多低
# 第一批结论（pk 385874，1024 原子，scf_thr 1e-5）：**只有 mixing_ndim 8→24 能收敛**
#   （23 步、drho 单调降到 8.8e-6、exit 0、E/atom 与阶梯参考一致）；
#   加强 Kerker（gg0 2/5）反而更差，减 β / 加 restart / 加展宽 / 加 nbands 都无效，
#   组合（gg0 5+ndim 24+restart+β0.2）虽然不散但收敛极慢。
# 本批：① 找 ndim 的下界与趋势（16/32）；② 探 scf_thr 的真实下限（1e-6/1e-7）；
#   ③ ndim 24 下加一点 Kerker 是否减少步数；④ ndim 40 是否对 1e-6 必要。
# 其余参数同第一批：8x8x8、Γ-only、sg15_sz、ecutwfc 65、genelpa、mp σ=0.015、
#   β=0.5、gg0 默认 1.0、nbands 18023、scf_nmax 100（给足空间）。
# ============================================================================
test_scf_conv2:
  abacus:
    supercells:
      - matrix: [[8, 0, 0], [0, 8, 0], [0, 0, 8]]
        label: q_ndim16
        scf_thr: 1e-5
        scf_nmax: 100
        mixing_beta: 0.5
        mixing_ndim: 24
      - matrix: [[8, 0, 0], [0, 8, 0], [0, 0, 8]]
        label: q_ndim32
        scf_thr: 1e-5
        scf_nmax: 100
        mixing_beta: 0.5
        mixing_ndim: 24
      - matrix: [[8, 0, 0], [0, 8, 0], [0, 0, 8]]
        label: q_ndim24_thr1e-6
        scf_thr: 1e-6
        scf_nmax: 100
        mixing_beta: 0.5
        mixing_ndim: 24
      - matrix: [[8, 0, 0], [0, 8, 0], [0, 0, 8]]
        label: q_ndim24_thr1e-7
        scf_thr: 1e-7
        scf_nmax: 100
        mixing_beta: 0.5
        mixing_ndim: 24
      - matrix: [[8, 0, 0], [0, 8, 0], [0, 0, 8]]
        label: q_ndim24_gg0_2
        scf_thr: 1e-5
        scf_nmax: 100
        mixing_beta: 0.5
        mixing_ndim: 24
        mixing_gg0: 2
      - matrix: [[8, 0, 0], [0, 8, 0], [0, 0, 8]]
        label: q_ndim40_thr1e-6
        scf_thr: 1e-6
        scf_nmax: 100
        mixing_beta: 0.5
        mixing_ndim: 40

# ============================================================================
# 99_scf_thr/para_test 第三批：mixing_ndim 的下界 + 尺寸依赖
# 第二批（pk 386436）结论：ndim 24 下 scf_thr 1e-5/1e-6/1e-7 **全部收敛**
#   （drho 8.8e-6 / 5.0e-7 / 7.5e-8，23/29/45 步），且总能差只有 0.003 meV/atom。
#   （第二批里的 q_ndim16/q_ndim32 因我漏传 mixing_ndim，实际都是 24 —— 那两格
#   变成了重复性检验：结果逐位一致，说明跑批确定性良好。）
# 本批目的：
#   1) 1024 原子上找 ndim 的最小可用值（8 失败、24 成功 ⇒ 二分 16/20）；
#   2) **尺寸依赖**：250 与 432 原子上 ndim 8（默认）是否够用 ⇒ 定出"从多大胞开始
#      必须调大 mixing_ndim"。这是给生产 preset 用的判据。
# 其余参数同前：Γ-only、sg15_sz、ecutwfc 65、genelpa、mp σ=0.015、β=0.5、gg0 默认。
#   nbands 按各尺寸取 1.1×占据数（1024→18023、432→7603、250→4400）。
# ============================================================================
test_scf_conv3:
  abacus:
    supercells:
      - matrix: [[8, 0, 0], [0, 8, 0], [0, 0, 8]]
        label: r_1024_ndim16
        scf_thr: 1e-5
        scf_nmax: 100
        mixing_beta: 0.5
        nbands: 18023
        mixing_ndim: 16
      - matrix: [[8, 0, 0], [0, 8, 0], [0, 0, 8]]
        label: r_1024_ndim20
        scf_thr: 1e-5
        scf_nmax: 100
        mixing_beta: 0.5
        nbands: 18023
        mixing_ndim: 20
      - matrix: [[5, 0, 0], [0, 5, 0], [0, 0, 5]]
        label: r_250_ndim8
        scf_thr: 1e-5
        scf_nmax: 100
        mixing_beta: 0.5
        nbands: 4400
        mixing_ndim: 8
      - matrix: [[5, 0, 0], [0, 5, 0], [0, 0, 5]]
        label: r_250_ndim24
        scf_thr: 1e-5
        scf_nmax: 100
        mixing_beta: 0.5
        nbands: 4400
        mixing_ndim: 24
      - matrix: [[6, 0, 0], [0, 6, 0], [0, 0, 6]]
        label: r_432_ndim8
        scf_thr: 1e-5
        scf_nmax: 100
        mixing_beta: 0.5
        nbands: 7603
        mixing_ndim: 8
      - matrix: [[6, 0, 0], [0, 6, 0], [0, 0, 6]]
        label: r_432_ndim24
        scf_thr: 1e-5
        scf_nmax: 100
        mixing_beta: 0.5
        nbands: 7603
        mixing_ndim: 24

