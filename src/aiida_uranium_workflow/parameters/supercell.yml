# Supercell SCF workflow protocol — per-backend layout.
#
# Runs one fixed-lattice SCF per supercell matrix, each with its own
# SCF parameters. The per-backend SCF base lives in
# ``parameters/<backend>/scf.yml``; this protocol supplies the
# supercell list and per-cell overrides on top of the base preset.
#
# Each supercell entry:
#   matrix     — 3×3 integer transformation matrix (rows = new lattice
#                vectors in terms of the primitive cell), e.g. the
#                identity for the primitive cell, diag(2,2,2) for the
#                2×2×2 supercell, or a non-diagonal integer matrix.
#   label      — optional short name (default "cell<N>").
#   SCF keys   — optional overrides applied on top of the base preset
#                (see workflows/supercell/abacus.py::_SCF_OVERRIDE_KEYS):
#                kpoints_mesh / kpoints_distance, scf_thr, scf_nmax,
#                mixing_beta, mixing_beta_mag, mixing_ndim,
#                smearing_method, smearing_sigma, symmetry, ...
#   max_iterations — optional restart budget of the per-supercell
#                AbacusBaseWorkChain (how many times a failed SCF is
#                retried with adjusted settings — scf_nmax → mixing_beta
#                ladder). Also settable once for the whole protocol at
#                the ``abacus`` block level. When unset the aiida-abacus
#                plugin default of 5 applies; set 0 to disable restarts.
#
# NOTE on k-points: per fleur.md, the k-point DENSITY should stay the
# same for the primitive cell and its supercells — halve the mesh as
# the cell doubles (e.g. 11³ primitive → 7³ for 2×2×2 → 5³ for 3×3×3).
#
# NOTE on performance (large supercells): ``rhog_symmetry`` (the density
# symmetrization step) is a known ABACUS bottleneck — on the 8×8×8
# (1024-atom) cell it consumed ~83 % of the wall time. With a 1×1×1
# k-mesh it carries no physics and can be disabled with ``symmetry: 0``
# (verified: 5.2× speedup on 4×4×4, ΔE = 0.03 meV/atom).
#
#   input.json:
#     "parameters": {
#         "abacus":  {"scf": ["lcao_r"]},   # SCF base (scf.yml)
#         "supercell": "test"               # this protocol preset
#     }

test:
  abacus:
    supercells:
      # Primitive cell, reference run.
      - matrix: [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
        label: 1x1x1
        kpoints_mesh: [11, 11, 11]
      # 2×2×2 supercell — halved k-mesh keeps the k density; a slightly
      # looser SCF threshold is often needed for large cells.
      - matrix: [[2, 0, 0], [0, 2, 0], [0, 0, 2]]
        label: 2x2x2
        kpoints_mesh: [7, 7, 7]
        scf_thr: 1e-6
        mixing_beta: 0.4
        mixing_ndim: 8
      # Non-diagonal example (kept commented — uncomment to use).
      # - matrix: [[2, 1, 0], [1, 2, 0], [0, 0, 2]]
      #   label: skew
      #   kpoints_distance: 0.1
      #   scf_thr: 1e-6

test_soc:
  abacus:
    supercells:
      - matrix: [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
        label: 1x1x1
        kpoints_mesh: [11, 11, 11]
      - matrix: [[2, 0, 0], [0, 2, 0], [0, 0, 2]]
        label: 2x2x2
        kpoints_mesh: [7, 7, 7]
        scf_thr: 1e-6
        mixing_beta: 0.2
        mixing_beta_mag: 0.8
        mixing_angle: 1.0
        mixing_ndim: 12

test333:
  abacus:
    supercells:
      - matrix: [[3, 0, 0], [0, 3, 0], [0, 0, 3]]
        label: 3x3x3
        kpoints_mesh: [1, 1, 1]
        scf_thr: 1e-6
        mixing_beta: 0.4
        mixing_ndim: 8

test555:
  abacus:
    supercells:
      - matrix: [[5, 0, 0], [0, 5, 0], [0, 0, 5]]
        label: 5x5x5
        kpoints_mesh: [1, 1, 1]
        scf_thr: 1e-5
        mixing_beta: 0.4
        mixing_ndim: 8

test888:
  abacus:
    # Shared restart budget for all 8×8×8 cells below (per-cell
    # ``max_iterations`` would override this).
    max_iterations: 5
    supercells:
      # 8×8×8 (1024-atom) metallic cell. See the performance note at the
      # top: mixing_beta 0.4 + symmetry 0 would cut the wall time ~5×
      # (rhog_symmetry is ~83 % of it), keeping smearing consistent with
      # the smaller supercells.
      - matrix: [[8, 0, 0], [0, 8, 0], [0, 0, 8]]
        label: 8x8x8
        kpoints_mesh: [1, 1, 1]
        scf_thr: 5e-5
        scf_nmax: 200
        mixing_beta: 0.4
        mixing_ndim: 16

# ---------------------------------------------------------------------------
# 4×4×4 (128-atom) comparison — default vs optimised SCF settings
# (validated on 2026-09-02: symmetry 0 + mixing 0.2 + scf_thr 1e-4 give
# a 5.2× speedup at ΔE = 0.03 meV/atom)
# ---------------------------------------------------------------------------

444_default:
  abacus:
    supercells:
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_default
        kpoints_mesh: [1, 1, 1]
        scf_thr: 5e-5
        scf_nmax: 200
        mixing_beta: 0.4
        mixing_ndim: 16

444_opt:
  abacus:
    supercells:
      - matrix: [[4, 0, 0], [0, 4, 0], [0, 0, 4]]
        label: 4x4x4_opt
        kpoints_mesh: [1, 1, 1]
        scf_thr: 1e-4
        scf_nmax: 200
        mixing_beta: 0.2
        mixing_ndim: 16
        symmetry: 0

test_sym:
  abacus:
    supercells:
      - matrix: [[8, 0, 0], [0, 8, 0], [0, 0, 8]]
        label: 8x8x8_sym0      # ← 区分
        kpoints_mesh: [1, 1, 1]
        scf_thr: 1e-4
        mixing_beta: 0.4
        mixing_ndim: 8
        symmetry: 0
      - matrix: [[8, 0, 0], [0, 8, 0], [0, 0, 8]]
        label: 8x8x8_sym1      # ← 区分
        kpoints_mesh: [1, 1, 1]
        scf_thr: 1e-4
        mixing_beta: 0.4
        mixing_ndim: 8
        symmetry: 1

test_beta:
  abacus:
    supercells:
      - matrix: [[8, 0, 0], [0, 8, 0], [0, 0, 8]]
        label: 8x8x8_beta0p3      # ← 区分
        kpoints_mesh: [1, 1, 1]
        scf_thr: 1e-4
        mixing_beta: 0.3
        mixing_ndim: 8
        symmetry: 0
      - matrix: [[8, 0, 0], [0, 8, 0], [0, 0, 8]]
        label: 8x8x8_beta0p4      # ← 区分
        kpoints_mesh: [1, 1, 1]
        scf_thr: 1e-4
        mixing_beta: 0.4
        mixing_ndim: 8
        symmetry: 0
      - matrix: [[8, 0, 0], [0, 8, 0], [0, 0, 8]]
        label: 8x8x8_beta0p5
        kpoints_mesh: [1, 1, 1]
        scf_thr: 1e-4
        mixing_beta: 0.5
        mixing_ndim: 8
        symmetry: 0
      - matrix: [[8, 0, 0], [0, 8, 0], [0, 0, 8]]
        label: 8x8x8_beta0p6
        kpoints_mesh: [1, 1, 1]
        scf_thr: 1e-4
        mixing_beta: 0.6
        mixing_ndim: 8
        symmetry: 0