# 批 4e：scf_thr 放到 PEXSI 密度噪声之上（54 原子，method 3 + npole 22）
#
# 动机：批 4c 的冷启动是 9 步；热启动（用收敛的 genelpa 密度当初值）仍然是
# **7 步**。看 running_scf.log 就明白为什么：热启动第一步的 μ 已经是
# 2.20461 Ry、能量已经是收敛值，但 **drho 在第 1 步就是 8.99e-6、第 2 步 2.28e-5**
# —— PEXSI 密度的本底噪声约 1e-5，而 `scf_thr 1e-6` 要求 drho/ediff 低于 1e-6，
# 于是 SCF 只能继续迭代到能量稳定为止（7 步）。
#
# 所以真正决定步数的是 **scf_thr 与 PEXSI 密度噪声的相对位置**。
# 本批测 scf_thr 1e-6 / 1e-5 / 1e-4 的步数与能量：
