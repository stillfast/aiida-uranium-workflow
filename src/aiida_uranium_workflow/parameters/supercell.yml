test_1w:
  abacus:
    supercells:
      # ~11.7k-atom LCAO SCF. gamma_only single-k LCAO only supports
      # genelpa / elpa / scalapack_gvx in HSolverLCAO (cg / dav /
      # cg_in_lcao are rejected at solve time — verified in
      # hsolver_lcao.cpp). genelpa AND scalapack_gvx both died silently
      # right after "DONE : INIT SCF" on 2×1.5 TB nodes — kernel OOM
      # SIGKILL (exit 137, Intel MPI "KILLED BY SIGNAL: 9"), not a
      # solver bug: the first dense diagonalisation needs ~3×N²×8 B ≈
      # 2.2 TB+ on top of ~0.6–0.8 TB/node ABACUS arrays. Fix = scale
      # out num_machines (see static/metadata.yml, yeesuan_ys_1w → 4
      # nodes). Remove ks_solver once genelpa is validated at this scale.
      - matrix: [[18, 0, 0], [0, 18, 0], [0, 0, 18]]

# ============================================================================
# 【实测规则】大胞 SCF 的 mixing_ndim（2026-09-17，见
#   aiida-uranium-scripts/supercell/para_test/99_scf_thr/para_test/reports/）
#
# 实测边界（1024/686/432/250 原子，genelpa，scf_thr 1e-5）：
#   ≤ 432 原子：mixing_ndim 8（默认）完全够用 —— 与 24 **逐位相同**
#   ≥ 686 原子：必须 ≥ 16，**推荐 24**
#      686：ndim 8 发散（drho 触到 1.1e-5 后失稳）；16 = 32 步；**24 = 27 步**
#      1024：ndim 8 发散；16 = 24 步；20/24 = **23 步**
#   失稳形态：drho 先在 ~1e-4~1e-5 触底（甚至"看起来收敛"），随后反弹振荡到 1e-1。
#   ⇒ 用 ndim 8 跑大胞，即使 `scf_thr 1e-4` 时靠"偶然低谷"提前停止，结果也不可靠。
#
# 无效/有害（同批实测，勿再试）：加强 Kerker（gg0 2/5 更差）、减小 mixing_beta、
#   mixing_restart、加大 smearing_sigma、提高 nbands，以及它们的组合（过度阻尼）。
# 缺陷胞另见 parameters/defects.yml（vacancy_nums 早已按尺寸递升 8/8/12/16/24/24/24），
#   但 7x7x7/8x8x8 缺陷胞即便 ndim=24 仍卡在 1e-3~1e-2 ⇒ 需要热启动/换混合策略。
# ============================================================================

        mixing_ndim: 24
        label: 18x18x18
        ks_solver: scalapack_gvx

# ---------------------------------------------------------------------------
# Smoke test for the 18³ (11,664-atom) scalapack_gvx path — do NOT run a
# full 48 h job blind after the cg_in_lcao / genelpa failures. This entry
# stops after ONE electronic step (scf_nmax=1), so the run only pays the
# one-time INIT SCF (~40 min) + one H build + one dense diagonalization.
# Read the per-step timing from OUT.aiida/running_scf.log and the memory
# peak with `sacct -j <jobid> --format=JobID,Elapsed,MaxRSS,State`; then
# bump scf_nmax back and set a realistic wallclock for the full SCF.
# Expected terminal state: NOT converged (plugin exit 410) — that is the
# intended outcome of the smoke run, only the timings/memory matter.
# ---------------------------------------------------------------------------
test_1w_smoke:
  abacus:
    supercells:
      - matrix: [[18, 0, 0], [0, 18, 0], [0, 0, 18]]
        label: 18x18x18_smoke
        mixing_ndim: 24        # 大胞规则（见 test_nums 上方的实测说明）；本 cell 只跑 1 步，仅为一致性
        ks_solver: scalapack_gvx
        scf_nmax: 1

