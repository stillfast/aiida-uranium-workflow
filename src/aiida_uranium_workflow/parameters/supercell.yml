# 批 2b：PEXSI 参数"单变量"扫描（每个 cell 只改一个参数）
#
# 基线 = 批 2a 的最优点（npole 40，ΔE = +0.011 meV/atom vs genelpa）：
#   ks_solver pexsi / pexsi_method 2 / pexsi_npole 40 / pexsi_nproc_pole 8 /
#   pexsi_nmax 10 / pexsi_delta_e 20 / pexsi_elec_thr 1e-4 /
