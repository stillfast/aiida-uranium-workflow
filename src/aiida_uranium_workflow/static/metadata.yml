    withmpi: true
  # Example: metadata presets may carry arbitrary extra keys beyond
  # ``options`` — the loader passes the whole section through and only
  # ``options`` is consumed by the adapters (extra keys are ignored).
  pretend_text: "this key is carried but ignored — a placeholder demo"

