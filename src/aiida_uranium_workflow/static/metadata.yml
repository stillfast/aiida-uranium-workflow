  options:
    resources:
      num_machines: 4
      num_mpiprocs_per_machine: 56
      tot_num_mpiprocs: 224
    max_memory_kb: 1572864000  # 1.5 TB per node → --mem=1536000 (MB)
    max_wallclock_seconds: 172800  # 48 h
    queue_name: "d2_ys"
