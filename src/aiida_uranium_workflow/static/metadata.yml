# 1 node / d2_ys / 48 h。给 2662 原子（11x11x11）用：384005 实测 2250 s/步，
# 24 h 只够 ~38 步且会撞 wallclock；48 h 才容得下 20-40 步的收敛过程。
yeesuan_ys_48h:
  options:
    resources:
      num_machines: 1
      num_mpiprocs_per_machine: 56
      tot_num_mpiprocs: 56
    max_wallclock_seconds: 172800
    max_memory_kb: 1572864000
    queue_name: "d2_ys"
    withmpi: true
# d2_ys is a 1.5 TB-per-node fat-memory partition (MEMORY 1545000 MB per
# node, verified via `sinfo -p d2_ys`). Large supercells (10⁴+ atoms,
# LCAO) OOM at the default per-job memory — ask for the full node memory
# explicitly. ``max_memory_kb`` is AiiDA's scheduler option (the Slurm
# plugin writes ``--mem=<kB//1024>`` in MB and it is *per node*); 1.5 TB
# = 1500·1024·1024 kB.
#
# The 11k-atom / 303k-basis LCAO SCF needs ~1.5 TB across all ranks
# (DMK ~25 GB/rank + dense-diagonalisation workspace); a single 1.5 TB
# node is exactly saturated and the kernel OOM-kills the job. Scale out
# instead: the per-rank footprint stays ~constant, so N fat nodes give
# N×1.5 TB. ``num_machines`` = number of d2_ys nodes, 56 ranks each
# (ABACUS LCAO diagonalisation is MPI-parallel across nodes via
# genelpa/ELPA; ``--mem`` stays 1.5 TB per node).
# 2-node result (2026-09-08, pks 378414/378465/378481): the first dense
# diagonalisation still OOM-kills a node (kernel SIGKILL / exit 137 /
# Intel MPI "KILLED BY SIGNAL: 9" on n09091/n09092 right after
# "DONE : INIT SCF" — 3×N² dense workspace ≈ 2.2 TB+ on top of the
# ~0.6–0.8 TB/node ABACUS arrays exceeds 2×1.5 TB). 4 nodes (6 TB)
# spreads the dense buffers to ~1 TB/node peak. Raise num_machines
# further if a node is still OOM-killed.
# q_ysuan node with its *full* memory. Everything else on this
# partition (``yeesuan``) inherits the computer default
# ``default_memory_per_machine = 50000000`` kB, i.e. the Slurm script
# gets ``#SBATCH --mem=48828`` (47.7 GB) — a q_ysuan node actually has
# 190000 MB, so memory-hungry jobs (PEXSI, large LCAO basis sets,
# 4×4×4-and-bigger cells) are cgroup-OOM-killed at ~48 GB. Verified on
# 2026-09-11: the 128-atom PEXSI cell died with
# "Detected 5 oom-kill event(s) ... Out Of Memory" while the same input
# run by hand with the full node finished in 106 s.
# ``max_memory_kb`` is the scheduler option (kb); the plugin writes
# ``--mem=<kb//1024>`` MB, so 189440000 kB → ``--mem=185000`` (MB),
# just under the node's 190000 MB.
yeesuan_190g:
  options:
    resources:
      num_machines: 1
      num_mpiprocs_per_machine: 56
      tot_num_mpiprocs: 56
    max_memory_kb: 189440000  # 185 GB of the node's 190 GB
    max_wallclock_seconds: 43200  # q_ysuan has no partition time limit
    queue_name: "q_ysuan"
    withmpi: true

