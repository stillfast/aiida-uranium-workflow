yeesuan_ys_chg:
  options:
    resources:
      num_machines: 1
      num_mpiprocs_per_machine: 56
      tot_num_mpiprocs: 56
    max_wallclock_seconds: 86400
    max_memory_kb: 1572864000
    queue_name: "d2_ys"
    withmpi: true
    # Expand the small template cube (shipped via abacus.extra_files as
    # SPIN1_CHG_TEMPLATE.cube) into the full-size initial density ON THE
    # CLUSTER, right before the ABACUS run — nothing big is stored in
    # AiiDA. ``-o SPIN1_CHG.cube`` guarantees the file name ABACUS's
    # ``init_chg file`` + ``read_file_dir ./`` expects.
    prepend_text: >-
      /sh3/ysuanbase/home/yeesuan17910/miniconda3/envs/orbgen/bin/python3
      expand_cube.py SPIN1_CHG_TEMPLATE.cube -s 8 8 8 -o SPIN1_CHG.cube
  # NB: arbitrary extra keys must sit OUTSIDE ``options`` (as siblings) —
  # ``options`` is injected verbatim into ``abacus.metadata.options``,
  # whose namespace is non-dynamic.
  pretend_text: "python expand_cube.py SPIN1_CHG_TEMPLATE.cube -s 8 8 8"

