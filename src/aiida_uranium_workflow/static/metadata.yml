yunhe:
  options:
    optimize_resources: false
    resources:
      # 8 MPI ranks/node. The band / DOS runs operate on small k-point
      # sets (band path 0.02 Å⁻¹ -> 406 k-points; DOS reuses the SCF
      # mesh -> 56 irreducible k-points). FleurBaseWorkChain.check_kpts
      # aborts with exit 390 if the best divisor-based setup uses < 60%
      # of the node (24 ranks -> only 14 usable -> 58%).
      # NOTE: tot_num_mpiprocs must NOT be set here — check_kpts
      # re-optimizes num_mpiprocs_per_machine per k-point count (e.g.
      # 8 -> 7 for the 406-k-point band path) and leaves any pinned
      # tot_num_mpiprocs stale, which trips the SlurmScheduler
      # consistency check (`tot_num_mpiprocs != num_mpiprocs_per_machine
      # * num_machines`) and makes the WorkChain EXCEPT. Without it,
      # Slurm derives the total automatically.
      num_machines: 1
      num_mpiprocs_per_machine: 8
    # 6 h: 54-atom U supercell SCFs (phonopy / eos) exceed 2 h even with
    # nspin=1; jobs that finish early do not consume the limit.
    max_wallclock_seconds: 21600
    queue_name: "CPU"
    withmpi: true
yeesuan_8n_384:
  # 8-node job on the q_ysuan_384 partition (384 GB/node, no time limit,
  # 56 cores/node). Used for the 1024-atom (8x8x8) PEXSI timing test: PEXSI's
  # SelInv scales with the *total* rank count (measured 3.07x going from 56 to
  # 224 ranks at 250 atoms), and its memory is distributed across the pole
  # groups, so 8x56 = 448 ranks is the sweet spot that still fits comfortably
  # (measured 56-79 GB total for 1024 atoms in the size ladder).
  options:
    resources:
      num_machines: 8
      num_mpiprocs_per_machine: 56
      tot_num_mpiprocs: 448
    max_memory_kb: 389120000  # 380 GB of the node's 384 GB (--mem is per node)
    max_wallclock_seconds: 86400
    queue_name: "q_ysuan_384"
    withmpi: true

yeesuan_4n_384:
  # 4-node job on q_ysuan_384 (384 GB/node, no partition time limit, 56 cores
  # per node). Used for the 1024-atom PEXSI timing test after the 8-node run
  # was cancelled externally: 4x56 = 224 ranks, and `pexsi_nproc_pole 28`
  # divides it (8 ranks per pole group, 30 poles -> 2 waves).
  # 48 h cap so that a full 60-step SCF (est. 25-50 min/step) cannot be killed
  # by the wallclock; the job exits as soon as the SCF converges.
  options:
    resources:
      num_machines: 4
      num_mpiprocs_per_machine: 56
      tot_num_mpiprocs: 224
    max_memory_kb: 389120000  # 380 GB of the node's 384 GB (--mem is per node)
    max_wallclock_seconds: 172800
    queue_name: "q_ysuan_384"
    withmpi: true

yeesuan_ys_fat1:
  # 1 fat node on d2_ys (RealMemory 1 545 000 MB) with the memory EXPLICITLY
  # requested. The plain ``yeesuan_ys_24h`` preset sets no ``max_memory_kb``,
  # so AiiDA inherits the computer default (50 000 000 kB -> --mem=48828 MB =
  # 47.7 GB) even though the node has 1.5 TB. That is what OOM-killed the
  # 11x11x11 / 2000-atom cells:
  #   384002 (2000 atoms)  --mem=48828 -> OUT_OF_MEMORY  (242 oom-kill events)
  #   382893 (2662 atoms)  --mem=48828 -> Out Of Memory  (35 oom-kill events)
  #   while 380158 (2000 atoms, same script) happened to fit.
  # Use this preset for every genelpa supercell above ~1000 atoms.
  options:
    resources:
      num_machines: 1
      num_mpiprocs_per_machine: 56
      tot_num_mpiprocs: 56
    max_memory_kb: 1572864000   # 1.5 TB of the node's 1.5 TB (--mem is per node)
    max_wallclock_seconds: 172800  # 48 h
    queue_name: "d2_ys"
    withmpi: true

yeesuan_1n_384:
  # 1 node on q_ysuan_384 (384 GB/node, no partition time limit, 56 cores).
  # Used for the 2662-atom (11x11x11) convergence validation: the earlier
  # attempts ran on d2_ys with the inherited --mem=48828 MB (47.7 GB) and either
  # OOM-killed (382893) or survived only by luck; ABACUS's own arrays grow with
  # the cell volume, so give the node's memory explicitly.
  options:
    resources:
      num_machines: 1
      num_mpiprocs_per_machine: 56
      tot_num_mpiprocs: 56
    max_memory_kb: 389120000   # 380 GB of the node's 384 GB (--mem is per node)
    max_wallclock_seconds: 172800  # 48 h: 2662 atoms costs ~2250 s/step
    queue_name: "q_ysuan_384"
    withmpi: true
